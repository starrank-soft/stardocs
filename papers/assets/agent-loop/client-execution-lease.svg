<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">多个窗口中的编辑器执行权</title>
  <desc id="desc">同一项目可由多个 Editor 窗口观察，系统根据在线状态、权限和能力选择一个窗口执行。每项调用另有独立执行凭证，只有当前凭证的结果能够写回。执行通过 EditorModel 修改同一份 Y.Doc 项目。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#17132a"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f4f49"/><stop offset="1" stop-color="#244b65"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="cyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
    <marker id="violet" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker>
    <style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:38px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.t{font-size:21px;font-weight:700;fill:#f8fafc}.p{font-size:16px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.box{filter:url(#shadow)}</style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" class="h">同一个项目打开多个窗口，谁来执行 Agent 的编辑命令</text>
  <text x="800" y="98" text-anchor="middle" class="sub">所有窗口都可以观察；同一项命令只交给一个具备执行权的 Editor</text>

  <g class="box"><rect x="555" y="145" width="490" height="120" rx="25" fill="#16273b" stroke="#64748b"/></g>
  <text x="800" y="187" text-anchor="middle" class="t">同一份协同项目</text>
  <text x="800" y="222" text-anchor="middle" class="p">时间线 · 素材 · 文档 · Y.Doc</text>

  <path d="M650 265C610 305 320 300 280 340" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#cyan)"/>
  <path d="M800 265V330" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#green)"/>
  <path d="M950 265C990 305 1280 300 1320 340" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#cyan)"/>

  <g class="box">
    <rect x="100" y="340" width="360" height="230" rx="26" fill="#14283a" stroke="#475569"/>
    <rect x="620" y="325" width="360" height="260" rx="28" fill="url(#active)" stroke="#34d399" stroke-width="3"/>
    <rect x="1140" y="340" width="360" height="230" rx="26" fill="#201d36" stroke="#475569"/>
  </g>

  <rect x="140" y="375" width="280" height="34" rx="10" fill="#1f3a4c"/><circle cx="165" cy="392" r="6" fill="#94a3b8"/><circle cx="187" cy="392" r="6" fill="#94a3b8"/><circle cx="209" cy="392" r="6" fill="#94a3b8"/>
  <text x="280" y="453" text-anchor="middle" class="t">窗口 A</text><text x="280" y="489" text-anchor="middle" class="p">在线 · 可观察项目</text><text x="280" y="524" text-anchor="middle" class="m">本次没有执行权</text>

  <rect x="660" y="360" width="280" height="34" rx="10" fill="#1b5b59"/><circle cx="685" cy="377" r="6" fill="#6ee7b7"/><circle cx="707" cy="377" r="6" fill="#6ee7b7"/><circle cx="729" cy="377" r="6" fill="#6ee7b7"/>
  <text x="800" y="438" text-anchor="middle" class="t">窗口 B · 当前执行者</text><text x="800" y="474" text-anchor="middle" class="p">在线 · 可写 · 具备所需能力</text>
  <rect x="695" y="510" width="210" height="42" rx="13" fill="#0f443d"/><text x="800" y="537" text-anchor="middle" class="p">已经确认准备完成</text>

  <rect x="1180" y="375" width="280" height="34" rx="10" fill="#302947"/><circle cx="1205" cy="392" r="6" fill="#94a3b8"/><circle cx="1227" cy="392" r="6" fill="#94a3b8"/><circle cx="1249" cy="392" r="6" fill="#94a3b8"/>
  <text x="1320" y="453" text-anchor="middle" class="t">窗口 C</text><text x="1320" y="489" text-anchor="middle" class="p">在线 · 可观察项目</text><text x="1320" y="524" text-anchor="middle" class="m">本次没有执行权</text>

  <g class="box"><rect x="80" y="665" width="430" height="140" rx="24" fill="#102e43" stroke="#38bdf8"/><rect x="585" y="635" width="430" height="200" rx="26" fill="#282044" stroke="#a78bfa"/><rect x="1090" y="665" width="430" height="140" rx="24" fill="#15342f" stroke="#34d399"/></g>
  <text x="295" y="706" text-anchor="middle" class="t">项目级执行权</text><text x="295" y="742" text-anchor="middle" class="p">从可用窗口中选择一个默认执行者</text><text x="295" y="775" text-anchor="middle" class="m">窗口断线或未确认时可以转移</text>

  <text x="800" y="679" text-anchor="middle" class="t">单次调用凭证</text><text x="800" y="716" text-anchor="middle" class="p">这项命令只接受当前执行者的这一次结果</text>
  <rect x="675" y="752" width="250" height="48" rx="14" fill="#30265a"/><text x="800" y="782" text-anchor="middle" class="p">编辑命令 + 执行凭证</text>

  <text x="1305" y="706" text-anchor="middle" class="t">同一条项目写入路径</text><text x="1305" y="742" text-anchor="middle" class="p">EditorModel → Y.Doc → 协同界面</text><text x="1305" y="775" text-anchor="middle" class="m">Agent 与人的修改进入同一项目</text>

  <path d="M510 735H575" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#cyan)"/>
  <path d="M800 635V595" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#violet)"/>
  <path d="M1015 735H1080" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#green)"/>
  <path d="M980 455C1090 455 1095 620 1220 655" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#green)"/>

  <text x="800" y="872" text-anchor="middle" class="m">读取可以在确认安全后改派；已经产生副作用的写入和渲染不会因窗口切换而盲目重放</text>
</svg>
