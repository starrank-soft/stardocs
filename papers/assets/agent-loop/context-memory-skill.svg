<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">上下文、记忆、项目与 Skill 的职责</title>
  <desc id="desc">完整历史保留权威消息，压缩生成模型读取视图；用户与项目记忆提供较稳定背景；当前项目通过工具按需读取；固定提示只列 Skill 索引，完整 Skill 按需加载。它们共同组成模型当前一次判断的输入。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#17132a"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".3"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker><marker id="v" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker><marker id="g" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:38px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.t{font-size:20px;font-weight:700;fill:#f8fafc}.p{font-size:16px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.box{filter:url(#s)}</style></defs>
  <rect width="1600" height="880" fill="url(#bg)"/><text x="800" y="60" text-anchor="middle" class="h">长时间创作中，模型这一轮应该读什么</text><text x="800" y="98" text-anchor="middle" class="sub">历史、压缩、记忆、当前项目和 Skill 不是同一份上下文</text>

  <g class="box"><rect x="60" y="175" width="285" height="260" rx="26" fill="#102e43" stroke="#38bdf8"/><rect x="405" y="175" width="285" height="260" rx="26" fill="#282044" stroke="#a78bfa"/><rect x="750" y="175" width="285" height="260" rx="26" fill="#172a3d" stroke="#38bdf8"/><rect x="1095" y="175" width="285" height="260" rx="26" fill="#15342f" stroke="#34d399"/></g>
  <text x="202" y="218" text-anchor="middle" class="t">完整历史 · 总账</text><text x="202" y="255" text-anchor="middle" class="p">用户消息</text><text x="202" y="286" text-anchor="middle" class="p">Tool Call / Result</text><text x="202" y="317" text-anchor="middle" class="p">隐藏上下文</text><rect x="105" y="350" width="195" height="48" rx="14" fill="#12384a"/><text x="202" y="380" text-anchor="middle" class="m">不因压缩而删除</text>
  <text x="547" y="218" text-anchor="middle" class="t">压缩视图 · 摘要</text><text x="547" y="255" text-anchor="middle" class="p">从完整历史派生</text><text x="547" y="286" text-anchor="middle" class="p">保留当前目标与开放调用</text><rect x="450" y="350" width="195" height="48" rx="14" fill="#30265a"/><text x="547" y="380" text-anchor="middle" class="m">供当前模型读取</text>
  <text x="892" y="218" text-anchor="middle" class="t">分层记忆 · 备忘录</text><text x="892" y="255" text-anchor="middle" class="p">用户长期</text><text x="892" y="286" text-anchor="middle" class="p">用户当日</text><text x="892" y="317" text-anchor="middle" class="p">项目约定与决策</text><rect x="795" y="350" width="195" height="48" rx="14" fill="#12384a"/><text x="892" y="380" text-anchor="middle" class="m">按 scope 更新</text>
  <text x="1237" y="218" text-anchor="middle" class="t">当前 Project · 现场</text><text x="1237" y="255" text-anchor="middle" class="p">时间线 · 素材 · 画布</text><text x="1237" y="286" text-anchor="middle" class="p">等待期间仍会变化</text><rect x="1140" y="350" width="195" height="48" rx="14" fill="#0f443d"/><text x="1237" y="380" text-anchor="middle" class="m">行动前通过工具读取</text>
  <path d="M345 305H395" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#v)"/>

  <g class="box"><rect x="1435" y="175" width="115" height="260" rx="24" fill="#211e36" stroke="#a78bfa"/></g>
  <text x="1492" y="218" text-anchor="middle" class="t">Skill</text><text x="1492" y="258" text-anchor="middle" class="m">固定提示</text><text x="1492" y="282" text-anchor="middle" class="m">只放索引</text><path d="M1460 320H1525V386H1460Z" fill="#30265a" stroke="#c4b5fd"/><path d="M1475 340H1510M1475 355H1510M1475 370H1500" stroke="#ddd6fe"/><text x="1492" y="418" text-anchor="middle" class="m">按需加载全文</text>

  <rect x="245" y="545" width="1110" height="190" rx="30" fill="#151f32" stroke="#64748b" stroke-width="2"/>
  <text x="800" y="590" text-anchor="middle" class="t">模型当前一次判断需要的输入</text>
  <rect x="300" y="630" width="210" height="58" rx="15" fill="#282044"/><rect x="545" y="630" width="210" height="58" rx="15" fill="#172a3d"/><rect x="790" y="630" width="210" height="58" rx="15" fill="#15342f"/><rect x="1035" y="630" width="265" height="58" rx="15" fill="#30265a"/>
  <text x="405" y="666" text-anchor="middle" class="p">历史或压缩视图</text><text x="650" y="666" text-anchor="middle" class="p">当前记忆快照</text><text x="895" y="666" text-anchor="middle" class="p">当前项目身份</text><text x="1167" y="666" text-anchor="middle" class="p">任务需要时加载 Skill</text>
  <path d="M202 435C202 500 405 500 405 620" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M547 435V620" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#v)"/><path d="M892 435C892 520 650 520 650 620" stroke="#67e8f9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1237 435C1237 520 895 520 895 620" stroke="#6ee7b7" stroke-width="3" fill="none" marker-end="url(#g)"/><path d="M1492 435C1492 540 1167 540 1167 620" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#v)"/>
  <text x="800" y="805" text-anchor="middle" class="m">项目当前状态不复制进长对话；Skill 提供方法，不替代对成片节奏、美感与运动的真实验证</text>
</svg>
