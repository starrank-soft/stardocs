<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SSE 与 WebSocket 的职责分工</title>
  <desc id="desc">服务端通过 SSE 向浏览器持续发送回答、状态和增量，通过 WebSocket 下发客户端操作并接收执行结果；持久消息和统一调用身份负责断线后的恢复与结果归属。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="1" stop-color="#17132b"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="68" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">回答与执行结果如何在端云间流动</text>
  <text x="800" y="108" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">SSE 负责可恢复的下行流 · WebSocket 负责在线编辑器的双向执行</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="70" y="180" width="370" height="500" rx="34" fill="url(#server)" stroke="#38bdf8" stroke-width="3"/>
    <text x="255" y="235" text-anchor="middle" fill="#e0f2fe" font-size="27" font-weight="700">服务端 Agent Runtime</text>
    <rect x="120" y="280" width="270" height="78" rx="20" fill="#113449"/>
    <text x="255" y="312" text-anchor="middle" fill="#bae6fd" font-size="19" font-weight="700">模型回答与运行状态</text>
    <text x="255" y="339" text-anchor="middle" fill="#94a3b8" font-size="15">增量 + 完整消息</text>
    <rect x="120" y="395" width="270" height="78" rx="20" fill="#202044"/>
    <text x="255" y="427" text-anchor="middle" fill="#ede9fe" font-size="19" font-weight="700">客户端操作</text>
    <text x="255" y="454" text-anchor="middle" fill="#a5b4fc" font-size="15">等待在线编辑器执行</text>
    <rect x="120" y="510" width="270" height="110" rx="20" fill="#113a38"/>
    <text x="255" y="545" text-anchor="middle" fill="#a7f3d0" font-size="19" font-weight="700">持久消息与结果</text>
    <text x="255" y="577" text-anchor="middle" fill="#d1fae5" font-size="15">恢复、重放、结果归属</text>
    <text x="255" y="604" text-anchor="middle" fill="#94a3b8" font-size="14">唯一持久事实</text>

    <rect x="1160" y="180" width="370" height="500" rx="34" fill="url(#client)" stroke="#a78bfa" stroke-width="3"/>
    <text x="1345" y="235" text-anchor="middle" fill="#f5f3ff" font-size="27" font-weight="700">浏览器 Editor</text>
    <rect x="1210" y="280" width="270" height="78" rx="20" fill="#30235a"/>
    <text x="1345" y="312" text-anchor="middle" fill="#e9d5ff" font-size="19" font-weight="700">显示回答与进度</text>
    <text x="1345" y="339" text-anchor="middle" fill="#c4b5fd" font-size="15">增量提升等待体验</text>
    <rect x="1210" y="395" width="270" height="78" rx="20" fill="#25305c"/>
    <text x="1345" y="427" text-anchor="middle" fill="#e0e7ff" font-size="19" font-weight="700">执行编辑器工具</text>
    <text x="1345" y="454" text-anchor="middle" fill="#a5b4fc" font-size="15">读取现场 · 修改项目</text>
    <rect x="1210" y="510" width="270" height="110" rx="20" fill="#233b45"/>
    <text x="1345" y="545" text-anchor="middle" fill="#d1fae5" font-size="19" font-weight="700">返回执行结果</text>
    <text x="1345" y="577" text-anchor="middle" fill="#a7f3d0" font-size="15">携带原调用身份</text>
    <text x="1345" y="604" text-anchor="middle" fill="#94a3b8" font-size="14">回到所属调用</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="535" y="205" width="530" height="176" rx="30" fill="#10293c" stroke="#22d3ee" stroke-width="2"/>
    <text x="800" y="252" text-anchor="middle" fill="#67e8f9" font-size="25" font-weight="700">SSE · 服务端下行</text>
    <text x="800" y="293" text-anchor="middle" fill="#e0f2fe" font-size="18">回答 · 已提交消息 · 运行状态 · 实时 Delta</text>
    <text x="800" y="333" text-anchor="middle" fill="#94a3b8" font-size="16">已提交内容按持久游标恢复</text>

    <rect x="535" y="430" width="530" height="214" rx="30" fill="#241d40" stroke="#a78bfa" stroke-width="2"/>
    <text x="800" y="477" text-anchor="middle" fill="#e9d5ff" font-size="25" font-weight="700">WebSocket · 双向执行</text>
    <text x="800" y="520" text-anchor="middle" fill="#ede9fe" font-size="18">→ 下发客户端操作</text>
    <text x="800" y="559" text-anchor="middle" fill="#ddd6fe" font-size="18">← 执行结果 · 在线能力状态</text>
    <text x="800" y="604" text-anchor="middle" fill="#94a3b8" font-size="16">连接中断不改变调用身份</text>
  </g>

  <path d="M440 300H525" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M1065 300H1150" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M440 510C485 510 490 510 525 510" fill="none" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowViolet)"/>
  <path d="M1065 510H1150" fill="none" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowViolet)"/>
  <path d="M1160 575C1115 575 1105 585 1065 585" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <path d="M535 585C490 585 480 575 440 575" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="190" y="745" width="1220" height="92" rx="30" fill="#121d30" stroke="#475569" stroke-width="2"/>
    <text x="800" y="782" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">实时增量可以丢失，完整消息与执行结果必须可以恢复</text>
    <text x="800" y="816" text-anchor="middle" fill="#94a3b8" font-size="18">两种连接共享消息身份和持久状态，不维护两套事实</text>
  </g>
</svg>
