<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">双环 Agent 的跨时间执行</title>
  <desc id="desc">Session 持续存在，多个短暂 Process 分别响应用户请求、任务完成和人工修改；等待和进程重启不会丢失持久事实。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081625"/>
      <stop offset="1" stop-color="#18142c"/>
    </linearGradient>
    <linearGradient id="session" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">Session 持续存在，Process 可以随时重建</text>
  <text x="800" y="112" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">等待不是挂起线程，而是保存“正在等什么”</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="78" y="212" fill="#94a3b8" font-size="20" font-weight="700">外部事实</text>
    <text x="78" y="372" fill="#94a3b8" font-size="20" font-weight="700">持久状态</text>
    <text x="78" y="555" fill="#94a3b8" font-size="20" font-weight="700">短暂执行</text>
    <text x="78" y="755" fill="#94a3b8" font-size="20" font-weight="700">Session</text>
  </g>

  <line x1="215" y1="232" x2="1510" y2="232" stroke="#334155" stroke-width="2"/>
  <line x1="215" y1="392" x2="1510" y2="392" stroke="#334155" stroke-width="2"/>
  <line x1="215" y1="575" x2="1510" y2="575" stroke="#334155" stroke-width="2"/>

  <g font-family="Inter, PingFang SC, sans-serif">
    <g transform="translate(285 0)">
      <circle cx="0" cy="232" r="14" fill="#22d3ee"/>
      <rect x="-82" y="157" width="164" height="50" rx="15" fill="#10283c" stroke="#38bdf8"/>
      <text x="0" y="188" text-anchor="middle" fill="#e0f2fe" font-size="18">用户提出任务</text>
      <line x1="0" y1="246" x2="0" y2="380" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7"/>
    </g>

    <g transform="translate(560 0)">
      <circle cx="0" cy="232" r="14" fill="#a78bfa"/>
      <rect x="-90" y="157" width="180" height="50" rx="15" fill="#211b3b" stroke="#a78bfa"/>
      <text x="0" y="188" text-anchor="middle" fill="#ede9fe" font-size="18">提交异步任务</text>
      <line x1="0" y1="246" x2="0" y2="380" stroke="#a78bfa" stroke-width="3" stroke-dasharray="7 7"/>
    </g>

    <g transform="translate(850 0)">
      <circle cx="0" cy="232" r="14" fill="#fb7185"/>
      <rect x="-92" y="157" width="184" height="50" rx="15" fill="#321b2e" stroke="#fb7185"/>
      <text x="0" y="188" text-anchor="middle" fill="#ffe4e6" font-size="18">Worker 被替换</text>
      <line x1="0" y1="246" x2="0" y2="620" stroke="#fb7185" stroke-width="3" stroke-dasharray="7 7"/>
    </g>

    <g transform="translate(1055 0)">
      <circle cx="0" cy="232" r="14" fill="#34d399"/>
      <rect x="-88" y="157" width="176" height="50" rx="15" fill="#102d2d" stroke="#34d399"/>
      <text x="0" y="188" text-anchor="middle" fill="#d1fae5" font-size="18">任务全部完成</text>
      <line x1="0" y1="246" x2="0" y2="380" stroke="#34d399" stroke-width="3" stroke-dasharray="7 7"/>
    </g>

    <g transform="translate(1300 0)">
      <circle cx="0" cy="232" r="14" fill="#f59e0b"/>
      <rect x="-82" y="157" width="164" height="50" rx="15" fill="#302412" stroke="#f59e0b"/>
      <text x="0" y="188" text-anchor="middle" fill="#fef3c7" font-size="18">用户修改项目</text>
      <line x1="0" y1="246" x2="0" y2="380" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 7"/>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="215" y="330" width="1295" height="125" rx="28" fill="#121f34" stroke="#64748b"/>
    <text x="250" y="372" fill="#e2e8f0" font-size="20" font-weight="700">持久事件入口</text>
    <rect x="250" y="392" width="255" height="31" rx="12" fill="#0e7490"/>
    <text x="377" y="414" text-anchor="middle" fill="#ecfeff" font-size="16">请求与项目上下文</text>
    <rect x="530" y="392" width="255" height="31" rx="12" fill="#6d28d9"/>
    <text x="657" y="414" text-anchor="middle" fill="#f5f3ff" font-size="16">等待关系与任务句柄</text>
    <rect x="1010" y="392" width="235" height="31" rx="12" fill="#047857"/>
    <text x="1127" y="414" text-anchor="middle" fill="#ecfdf5" font-size="16">最终任务结果</text>
    <rect x="1270" y="392" width="205" height="31" rx="12" fill="#b45309"/>
    <text x="1372" y="414" text-anchor="middle" fill="#fffbeb" font-size="16">人的最新选择</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="235" y="505" width="420" height="135" rx="28" fill="#17243a" stroke="#38bdf8" stroke-width="2"/>
    <text x="445" y="548" text-anchor="middle" fill="#67e8f9" font-size="23" font-weight="700">Process 1</text>
    <text x="445" y="583" text-anchor="middle" fill="#cbd5e1" font-size="17">理解任务 → 调用工具 → 提交生成</text>
    <text x="445" y="613" text-anchor="middle" fill="#94a3b8" font-size="16">进入等待，执行结束</text>

    <rect x="955" y="505" width="215" height="135" rx="28" fill="#1d293b" stroke="#34d399" stroke-width="2"/>
    <text x="1062" y="548" text-anchor="middle" fill="#6ee7b7" font-size="23" font-weight="700">Process 2</text>
    <text x="1062" y="583" text-anchor="middle" fill="#cbd5e1" font-size="17">读取结果</text>
    <text x="1062" y="613" text-anchor="middle" fill="#94a3b8" font-size="16">编排画布</text>

    <rect x="1250" y="505" width="240" height="135" rx="28" fill="#2a2036" stroke="#f59e0b" stroke-width="2"/>
    <text x="1370" y="548" text-anchor="middle" fill="#fcd34d" font-size="23" font-weight="700">Process 3</text>
    <text x="1370" y="583" text-anchor="middle" fill="#cbd5e1" font-size="17">读取人的修改</text>
    <text x="1370" y="613" text-anchor="middle" fill="#94a3b8" font-size="16">继续完成</text>
  </g>

  <path d="M655 575 C760 575 845 575 955 575" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="12 12"/>
  <text x="804" y="548" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="Inter, PingFang SC, sans-serif">没有常驻 Process</text>
  <text x="804" y="606" text-anchor="middle" fill="#cbd5e1" font-size="17" font-family="Inter, PingFang SC, sans-serif">等待 · 休眠 · 重启</text>

  <rect x="215" y="720" width="1295" height="72" rx="36" fill="#101b31" stroke="#334155" stroke-width="2"/>
  <rect x="232" y="738" width="1260" height="36" rx="18" fill="url(#session)" opacity="0.9"/>
  <text x="860" y="763" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700" font-family="Inter, PingFang SC, sans-serif">同一个持久 Session：消息、等待关系、任务状态和项目引用持续存在</text>

  <path d="M445 640 L445 705" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1062 640 L1062 705" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1370 640 L1370 705" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
