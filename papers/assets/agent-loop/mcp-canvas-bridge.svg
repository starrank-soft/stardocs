<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP Canvas Bridge</title>
  <desc id="desc">外部 Agent 通过显式项目句柄和语义工具发起调用；服务端授权并路由给唯一连接 Editor，Editor 复用同一领域写路径修改权威项目，人类界面同步看到结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081524"/>
      <stop offset="1" stop-color="#19142d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">MCP Canvas：标准化连接，不复制编辑器</text>
  <text x="800" y="110" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">Agent 表达对象与意图，连接 Editor 将语义落实到同一权威项目</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="70" y="205" width="270" height="230" rx="30" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
    <text x="205" y="255" text-anchor="middle" fill="#67e8f9" font-size="25" font-weight="700">外部 Coding Agent</text>
    <rect x="112" y="292" width="186" height="48" rx="15" fill="#0c3147"/>
    <text x="205" y="323" text-anchor="middle" fill="#e0f2fe" font-size="18">读取项目资源</text>
    <rect x="112" y="355" width="186" height="48" rx="15" fill="#24204b"/>
    <text x="205" y="386" text-anchor="middle" fill="#ede9fe" font-size="18">提交语义操作</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="430" y="170" width="330" height="300" rx="32" fill="#191e38" stroke="#a78bfa" stroke-width="2"/>
    <text x="595" y="220" text-anchor="middle" fill="#ddd6fe" font-size="25" font-weight="700">MCP 边界</text>
    <text x="595" y="254" text-anchor="middle" fill="#94a3b8" font-size="17">连接 · 能力 · 请求 / 响应</text>
    <rect x="477" y="287" width="236" height="54" rx="17" fill="#2e2360"/>
    <text x="595" y="321" text-anchor="middle" fill="#f5f3ff" font-size="18">显式 project handle</text>
    <rect x="477" y="358" width="236" height="54" rx="17" fill="#182f48"/>
    <text x="595" y="392" text-anchor="middle" fill="#e0f2fe" font-size="18">鉴权 · 审计 · 调用关联</text>
  </g>

  <path d="M340 320 C375 320 395 320 430 320" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="850" y="170" width="300" height="300" rx="32" fill="#211a3a" stroke="#c084fc" stroke-width="2"/>
    <text x="1000" y="220" text-anchor="middle" fill="#f5d0fe" font-size="25" font-weight="700">连接 Editor</text>
    <text x="1000" y="254" text-anchor="middle" fill="#94a3b8" font-size="17">唯一有效执行者</text>
    <rect x="895" y="287" width="210" height="54" rx="17" fill="#34235d"/>
    <text x="1000" y="321" text-anchor="middle" fill="#f5f3ff" font-size="18">解析语义操作</text>
    <rect x="895" y="358" width="210" height="54" rx="17" fill="#173044"/>
    <text x="1000" y="392" text-anchor="middle" fill="#e0f2fe" font-size="18">提交领域修改</text>
  </g>

  <path d="M760 320 C795 320 815 320 850 320" fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="805" y="298" text-anchor="middle" fill="#c4b5fd" font-size="15" font-family="Inter, PingFang SC, sans-serif">路由</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="1240" y="205" width="290" height="230" rx="30" fill="url(#state)" stroke="#34d399" stroke-width="3"/>
    <text x="1385" y="255" text-anchor="middle" fill="#d1fae5" font-size="25" font-weight="700">权威项目状态</text>
    <text x="1385" y="294" text-anchor="middle" fill="#a7f3d0" font-size="18">稳定对象身份</text>
    <text x="1385" y="330" text-anchor="middle" fill="#a7f3d0" font-size="18">领域约束</text>
    <text x="1385" y="366" text-anchor="middle" fill="#a7f3d0" font-size="18">协同与撤销语义</text>
    <rect x="1300" y="392" width="170" height="12" rx="6" fill="url(#accent)"/>
  </g>

  <path d="M1150 320 C1185 320 1205 320 1240 320" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowCyan)"/>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="850" y="590" width="300" height="170" rx="30" fill="#2b1d30" stroke="#fb7185" stroke-width="2"/>
    <text x="1000" y="640" text-anchor="middle" fill="#fda4af" font-size="25" font-weight="700">人类编辑界面</text>
    <rect x="895" y="675" width="210" height="24" rx="8" fill="#fb7185"/>
    <rect x="895" y="711" width="88" height="18" rx="6" fill="#f59e0b"/>
    <rect x="995" y="711" width="110" height="18" rx="6" fill="#8b5cf6"/>
  </g>

  <path d="M1385 435 C1385 555 1260 675 1150 675" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M1150 710 C1265 710 1400 575 1420 435" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="70" y="590" width="690" height="170" rx="30" fill="#121e32" stroke="#475569" stroke-width="2"/>
    <text x="115" y="638" fill="#f8fafc" font-size="22" font-weight="700">语义调用表达的是意图</text>
    <text x="115" y="680" fill="#67e8f9" font-size="18">✓ 将 clip_42 移动到 title_track 下方</text>
    <text x="115" y="719" fill="#94a3b8" font-size="18">✕ 点击 (817, 424)，拖到 (1200, 424)</text>
    <rect x="105" y="737" width="620" height="5" rx="2" fill="url(#accent)" opacity="0.85"/>
  </g>

  <path d="M1000 470 L1000 570" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#arrow)"/>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="255" y="812" width="1090" height="52" rx="26" fill="#151c31" stroke="url(#accent)" stroke-width="2"/>
    <text x="800" y="845" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">外部 Agent、内置 Agent 与人类 UI 可以有不同入口，但不能拥有不同的画布真相</text>
  </g>
</svg>
