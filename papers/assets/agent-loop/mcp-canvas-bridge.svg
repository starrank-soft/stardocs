<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">外部 Agent 通过 MCP 控制 StarCut 项目</title>
  <desc id="desc">外部 Coding Agent 保留自己的对话和 Agent Loop，通过 MCP 选择 StarCut 项目并调用语义工具。短编辑由一个在线 Editor 执行，长媒体任务返回任务身份供外部 Agent 观察；两者都复用同一项目模型和领域写入路径。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#17132a"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".3"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker><marker id="v" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#c4b5fd"/></marker><marker id="g" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#6ee7b7"/></marker><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.h{font-size:38px;font-weight:700;fill:#f8fafc}.sub{font-size:20px;fill:#94a3b8}.t{font-size:20px;font-weight:700;fill:#f8fafc}.p{font-size:16px;fill:#cbd5e1}.m{font-size:14px;fill:#94a3b8}.box{filter:url(#s)}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="60" text-anchor="middle" class="h">Codex、Claude Code 如何控制同一个项目</text><text x="800" y="98" text-anchor="middle" class="sub">外部 Agent 有自己的 Loop；StarCut 只开放项目能力与可恢复的执行通道</text>

  <g class="box"><rect x="65" y="170" width="285" height="190" rx="26" fill="#102e43" stroke="#38bdf8"/><rect x="430" y="155" width="325" height="220" rx="28" fill="#282044" stroke="#a78bfa"/><rect x="835" y="155" width="330" height="220" rx="28" fill="#172a3d" stroke="#38bdf8"/><rect x="1245" y="170" width="290" height="190" rx="26" fill="#15342f" stroke="#34d399"/></g>
  <text x="207" y="215" text-anchor="middle" class="t">外部 Coding Agent</text><text x="207" y="250" text-anchor="middle" class="p">Codex / Claude Code</text><text x="207" y="282" text-anchor="middle" class="m">保留自己的对话与 Agent Loop</text><rect x="110" y="310" width="195" height="34" rx="11" fill="#123b51"/><text x="207" y="333" text-anchor="middle" class="m">MCP 语义工具调用</text>
  <text x="592" y="202" text-anchor="middle" class="t">MCP 边界</text><text x="592" y="237" text-anchor="middle" class="p">鉴权 · 选择项目 · 发现能力</text><rect x="475" y="274" width="235" height="62" rx="16" fill="#30265a"/><text x="592" y="301" text-anchor="middle" class="p">Agent Context</text><text x="592" y="325" text-anchor="middle" class="m">绑定 user / project / editor</text>
  <text x="1000" y="202" text-anchor="middle" class="t">项目调用通道</text><text x="1000" y="237" text-anchor="middle" class="p">复用项目协议，不创建内部对话</text><rect x="880" y="274" width="240" height="62" rx="16" fill="#12364a"/><text x="1000" y="301" text-anchor="middle" class="p">先提交调用，再等待结果</text><text x="1000" y="325" text-anchor="middle" class="m">结果仍关联原调用身份</text>
  <text x="1390" y="215" text-anchor="middle" class="t">连接中的 Editor</text><text x="1390" y="250" text-anchor="middle" class="p">执行权选择一个窗口</text><text x="1390" y="282" text-anchor="middle" class="m">在真实项目中执行</text><rect x="1295" y="310" width="190" height="34" rx="11" fill="#0f443d"/><text x="1390" y="333" text-anchor="middle" class="m">单次凭证防止旧结果</text>
  <path d="M350 265H420" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M755 265H825" stroke="#c4b5fd" stroke-width="4" fill="none" marker-end="url(#v)"/><path d="M1165 265H1235" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#a)"/>

  <g class="box"><rect x="895" y="490" width="450" height="160" rx="26" fill="#13352f" stroke="#34d399"/><rect x="1030" y="710" width="315" height="105" rx="22" fill="#102e43" stroke="#38bdf8"/></g>
  <text x="1120" y="535" text-anchor="middle" class="t">同一条项目写入路径</text><text x="1120" y="572" text-anchor="middle" class="p">语义操作 → EditorModel → Y.Doc</text><text x="1120" y="607" text-anchor="middle" class="m">人类界面、协同、撤销与渲染看到同一次修改</text>
  <text x="1187" y="748" text-anchor="middle" class="t">项目收信箱</text><text x="1187" y="780" text-anchor="middle" class="p">执行结果回到原调用</text>
  <path d="M1390 360C1390 430 1270 440 1200 480" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#g)"/><path d="M1120 650V700" stroke="#6ee7b7" stroke-width="4" fill="none" marker-end="url(#g)"/><path d="M1030 762C850 762 805 420 930 385" stroke="#67e8f9" stroke-width="4" fill="none" marker-end="url(#a)"/>

  <g class="box"><rect x="65" y="490" width="630" height="325" rx="28" fill="#161f32" stroke="#64748b"/></g>
  <text x="380" y="535" text-anchor="middle" class="t">两种 MCP 返回方式</text>
  <rect x="115" y="585" width="240" height="155" rx="20" fill="#102e43" stroke="#38bdf8"/><rect x="405" y="585" width="240" height="155" rx="20" fill="#282044" stroke="#a78bfa"/>
  <text x="235" y="625" text-anchor="middle" class="p">短编辑</text><text x="235" y="661" text-anchor="middle" class="m">有限时间内等待 Project Inbox</text><text x="235" y="695" text-anchor="middle" class="m">直接返回 Tool Result</text>
  <text x="525" y="625" text-anchor="middle" class="p">图片 / 视频 / 转写</text><text x="525" y="661" text-anchor="middle" class="m">立即返回 taskId</text><text x="525" y="695" text-anchor="middle" class="m">外部 Agent 使用 poll 查询</text>
  <path d="M895 762C760 790 700 690 655 670" stroke="#c4b5fd" stroke-width="3" fill="none" marker-end="url(#v)"/>
  <text x="800" y="862" text-anchor="middle" class="m">共享的是项目状态、领域工具与执行通道，不是两边的对话历史</text>
</svg>
