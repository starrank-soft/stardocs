<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">异步媒体任务如何回到 Agent</title>
  <desc id="desc">Agent 提交生成任务后，系统保存原工具调用与持久 Task 的关系。有限等待内完成的结果返回当前 Run，长时间生成转入后台并在关键状态变化后启动后续 Run；用户等待期间可以继续修改项目。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="1" stop-color="#18132b"/>
    </linearGradient>
    <linearGradient id="task" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="next" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#34d399"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="800" y="68" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">异步媒体任务如何回到 Agent</text>
  <text x="800" y="108" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">同一份权威 Task，两条等待路径</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="65" y="190" width="300" height="240" rx="30" fill="#10263b" stroke="#38bdf8" stroke-width="2"/>
    <text x="215" y="242" text-anchor="middle" fill="#67e8f9" font-size="25" font-weight="700">当前 Agent Run</text>
    <text x="215" y="286" text-anchor="middle" fill="#e2e8f0" font-size="19">判断需要新的素材</text>
    <rect x="105" y="320" width="220" height="56" rx="17" fill="#153951"/>
    <text x="215" y="355" text-anchor="middle" fill="#e0f2fe" font-size="18">提交生成任务</text>
    <text x="215" y="405" text-anchor="middle" fill="#94a3b8" font-size="16">可以继续工作或结束</text>

    <rect x="455" y="205" width="270" height="210" rx="28" fill="#241d3f" stroke="#a78bfa" stroke-width="2"/>
    <text x="590" y="256" text-anchor="middle" fill="#e9d5ff" font-size="24" font-weight="700">结果关联</text>
    <text x="590" y="298" text-anchor="middle" fill="#c4b5fd" font-size="17">Tool Call ↔ Task</text>
    <text x="590" y="336" text-anchor="middle" fill="#cbd5e1" font-size="17">记录结果属于谁</text>
    <text x="590" y="374" text-anchor="middle" fill="#94a3b8" font-size="16">有限等待 / 后台继续</text>

    <rect x="815" y="175" width="360" height="270" rx="32" fill="url(#task)" stroke="#34d399" stroke-width="3"/>
    <text x="995" y="230" text-anchor="middle" fill="#d1fae5" font-size="25" font-weight="700">权威媒体 Task</text>
    <text x="995" y="270" text-anchor="middle" fill="#a7f3d0" font-size="17">排队 · 运行 · 完成 · 失败</text>
    <rect x="865" y="310" width="260" height="58" rx="18" fill="#0c3b3d"/>
    <text x="995" y="346" text-anchor="middle" fill="#ecfdf5" font-size="18">Worker 后台执行</text>
    <text x="995" y="405" text-anchor="middle" fill="#a7f3d0" font-size="16">结果与版本始终保存在 Task</text>

    <rect x="1265" y="205" width="270" height="210" rx="28" fill="#16263b" stroke="#38bdf8" stroke-width="2"/>
    <text x="1400" y="256" text-anchor="middle" fill="#bae6fd" font-size="24" font-weight="700">状态通知</text>
    <text x="1400" y="300" text-anchor="middle" fill="#cbd5e1" font-size="17">只提示“任务变了”</text>
    <text x="1400" y="340" text-anchor="middle" fill="#94a3b8" font-size="16">接收方重新读取 Task</text>
    <text x="1400" y="378" text-anchor="middle" fill="#94a3b8" font-size="16">容忍重复、延迟与乱序</text>
  </g>

  <path d="M365 310H445" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M725 310H805" fill="none" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowViolet)"/>
  <path d="M1175 310H1255" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>

  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="80" y="510" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="2">两条返回路径</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="65" y="540" width="675" height="255" rx="32" fill="#102735" stroke="#22d3ee" stroke-width="2"/>
    <text x="105" y="590" fill="#67e8f9" font-size="23" font-weight="700">有限等待：结果紧接着就要使用</text>
    <rect x="110" y="635" width="230" height="78" rx="20" fill="#15364b"/>
    <text x="225" y="667" text-anchor="middle" fill="#e0f2fe" font-size="18">窗口内完成</text>
    <text x="225" y="696" text-anchor="middle" fill="#94a3b8" font-size="15">返回当前 Run</text>
    <rect x="465" y="635" width="230" height="78" rx="20" fill="#2a2342"/>
    <text x="580" y="667" text-anchor="middle" fill="#ede9fe" font-size="18">等待窗口结束</text>
    <text x="580" y="696" text-anchor="middle" fill="#a5b4fc" font-size="15">转入后台</text>

    <rect x="820" y="540" width="715" height="255" rx="32" fill="#211a3b" stroke="#a78bfa" stroke-width="2"/>
    <text x="860" y="590" fill="#e9d5ff" font-size="23" font-weight="700">长时间生成：当前 Run 可以结束</text>
    <rect x="865" y="635" width="205" height="78" rx="20" fill="#302451"/>
    <text x="967" y="667" text-anchor="middle" fill="#f5f3ff" font-size="18">观察任务变化</text>
    <text x="967" y="696" text-anchor="middle" fill="#c4b5fd" font-size="15">聚合任务变化</text>
    <rect x="1125" y="635" width="180" height="78" rx="20" fill="url(#next)"/>
    <text x="1215" y="667" text-anchor="middle" fill="#ffffff" font-size="18">后续 Run</text>
    <text x="1215" y="696" text-anchor="middle" fill="#ddd6fe" font-size="15">重新判断</text>
    <rect x="1360" y="635" width="130" height="78" rx="20" fill="#123b36"/>
    <text x="1425" y="667" text-anchor="middle" fill="#d1fae5" font-size="17">当前项目</text>
    <text x="1425" y="696" text-anchor="middle" fill="#a7f3d0" font-size="14">包含人的修改</text>
    <path d="M1070 674H1115" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
    <path d="M1360 674H1315" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  </g>

  <path d="M930 445C810 500 300 500 225 625" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowCyan)"/>
  <path d="M930 445C850 520 620 505 580 625" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowCyan)"/>
  <path d="M1400 415C1400 500 1010 480 970 625" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowViolet)"/>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="250" y="842" width="1100" height="48" rx="24" fill="#141f32" stroke="#475569" stroke-width="2"/>
    <text x="800" y="873" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700">模型执行可以结束，任务和项目继续存在；新事实到来后再启动下一次判断</text>
  </g>
</svg>
