<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monitor 的状态压缩与注意力压缩</title>
  <desc id="desc">大量任务增量先归并为权威最新状态；界面持续获得进度，而模型只在失败、阶段完成和全部完成等决策点被唤醒。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071722"/>
      <stop offset="1" stop-color="#17152c"/>
    </linearGradient>
    <linearGradient id="monitor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">Monitor：不是第二个任务系统，而是注意力压缩器</text>
  <text x="800" y="110" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">同一批权威任务，面向界面和模型采用不同更新节奏</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="88" y="174" fill="#94a3b8" font-size="18" font-weight="700" letter-spacing="2">高频增量通知</text>
    <rect x="70" y="195" width="330" height="510" rx="30" fill="#0f1e31" stroke="#334155" stroke-width="2"/>
    <text x="235" y="242" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="700">3 项生成任务</text>

    <g font-size="15" text-anchor="middle">
      <g fill="#164e63" stroke="#22d3ee">
        <rect x="100" y="275" width="78" height="36" rx="12"/><rect x="194" y="275" width="78" height="36" rx="12"/><rect x="288" y="275" width="78" height="36" rx="12"/>
        <rect x="100" y="327" width="78" height="36" rx="12"/><rect x="194" y="327" width="78" height="36" rx="12"/><rect x="288" y="327" width="78" height="36" rx="12"/>
        <rect x="100" y="379" width="78" height="36" rx="12"/><rect x="194" y="379" width="78" height="36" rx="12"/><rect x="288" y="379" width="78" height="36" rx="12"/>
        <rect x="100" y="431" width="78" height="36" rx="12"/><rect x="194" y="431" width="78" height="36" rx="12"/><rect x="288" y="431" width="78" height="36" rx="12"/>
        <rect x="100" y="483" width="78" height="36" rx="12"/><rect x="194" y="483" width="78" height="36" rx="12"/><rect x="288" y="483" width="78" height="36" rx="12"/>
        <rect x="100" y="535" width="78" height="36" rx="12"/><rect x="194" y="535" width="78" height="36" rx="12"/><rect x="288" y="535" width="78" height="36" rx="12"/>
        <rect x="100" y="587" width="78" height="36" rx="12"/><rect x="194" y="587" width="78" height="36" rx="12"/><rect x="288" y="587" width="78" height="36" rx="12"/>
      </g>
      <g fill="#cffafe">
        <text x="139" y="299">21%</text><text x="233" y="299">22%</text><text x="327" y="299">23%</text>
        <text x="139" y="351">24%</text><text x="233" y="351">25%</text><text x="327" y="351">26%</text>
        <text x="139" y="403">27%</text><text x="233" y="403">28%</text><text x="327" y="403">29%</text>
        <text x="139" y="455">30%</text><text x="233" y="455">31%</text><text x="327" y="455">32%</text>
        <text x="139" y="507">33%</text><text x="233" y="507">34%</text><text x="327" y="507">35%</text>
        <text x="139" y="559">…</text><text x="233" y="559">…</text><text x="327" y="559">…</text>
        <text x="139" y="611">98%</text><text x="233" y="611">99%</text><text x="327" y="611">100%</text>
      </g>
    </g>
    <text x="235" y="662" text-anchor="middle" fill="#64748b" font-size="17">重复 · 乱序 · 高频</text>
  </g>

  <path d="M400 445 C450 445 470 445 520 445" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="530" y="195" width="420" height="510" rx="34" fill="#132438" stroke="#34d399" stroke-width="2"/>
    <text x="740" y="245" text-anchor="middle" fill="#6ee7b7" font-size="24" font-weight="700">权威 Task 状态</text>
    <text x="740" y="277" text-anchor="middle" fill="#94a3b8" font-size="17">通知只提示“它变了”</text>

    <rect x="580" y="318" width="320" height="82" rx="20" fill="#102f36" stroke="#22d3ee"/>
    <circle cx="620" cy="359" r="14" fill="#22d3ee"/>
    <text x="655" y="351" fill="#e2e8f0" font-size="19" font-weight="700">图片 A</text>
    <text x="655" y="378" fill="#94a3b8" font-size="16">运行中 · 72% · version 18</text>

    <rect x="580" y="422" width="320" height="82" rx="20" fill="#2f202e" stroke="#fb7185"/>
    <circle cx="620" cy="463" r="14" fill="#fb7185"/>
    <text x="655" y="455" fill="#e2e8f0" font-size="19" font-weight="700">图片 B</text>
    <text x="655" y="482" fill="#fda4af" font-size="16">失败 · 需要重新决策</text>

    <rect x="580" y="526" width="320" height="82" rx="20" fill="#13302a" stroke="#34d399"/>
    <circle cx="620" cy="567" r="14" fill="#34d399"/>
    <text x="655" y="559" fill="#e2e8f0" font-size="19" font-weight="700">图片 C</text>
    <text x="655" y="586" fill="#6ee7b7" font-size="16">完成 · artifact ready</text>

    <rect x="620" y="642" width="240" height="38" rx="19" fill="url(#monitor)"/>
    <text x="740" y="667" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">读取最新版本，不复制任务</text>
  </g>

  <path d="M950 445 C1000 445 1020 445 1070 445" fill="none" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowViolet)"/>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="1080" y="195" width="450" height="235" rx="30" fill="#10293a" stroke="#38bdf8" stroke-width="2"/>
    <text x="1305" y="242" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="700">UI：持续显示</text>
    <rect x="1130" y="285" width="350" height="22" rx="11" fill="#1e293b"/>
    <rect x="1130" y="285" width="252" height="22" rx="11" fill="#22d3ee"/>
    <text x="1305" y="344" text-anchor="middle" fill="#cbd5e1" font-size="18">进度、日志和状态可以高频刷新</text>
    <g fill="#38bdf8" opacity="0.9">
      <circle cx="1150" cy="382" r="6"/><circle cx="1180" cy="382" r="6"/><circle cx="1210" cy="382" r="6"/><circle cx="1240" cy="382" r="6"/><circle cx="1270" cy="382" r="6"/><circle cx="1300" cy="382" r="6"/><circle cx="1330" cy="382" r="6"/><circle cx="1360" cy="382" r="6"/><circle cx="1390" cy="382" r="6"/><circle cx="1420" cy="382" r="6"/><circle cx="1450" cy="382" r="6"/>
    </g>

    <rect x="1080" y="470" width="450" height="235" rx="30" fill="#251b3a" stroke="#c084fc" stroke-width="2"/>
    <text x="1305" y="517" text-anchor="middle" fill="#e9d5ff" font-size="24" font-weight="700">Agent：按决策价值唤醒</text>
    <line x1="1140" y1="585" x2="1470" y2="585" stroke="#475569" stroke-width="3"/>
    <circle cx="1170" cy="585" r="14" fill="#fb7185"/>
    <circle cx="1320" cy="585" r="14" fill="#f59e0b"/>
    <circle cx="1450" cy="585" r="14" fill="#34d399"/>
    <text x="1170" y="626" text-anchor="middle" fill="#fda4af" font-size="16">失败</text>
    <text x="1320" y="626" text-anchor="middle" fill="#fcd34d" font-size="16">阶段完成</text>
    <text x="1450" y="626" text-anchor="middle" fill="#6ee7b7" font-size="16">全部完成</text>
    <text x="1305" y="671" text-anchor="middle" fill="#cbd5e1" font-size="18">少数几次高价值上下文</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="320" y="760" width="960" height="76" rx="28" fill="#131d31" stroke="url(#monitor)" stroke-width="2"/>
    <text x="800" y="792" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">状态压缩：大量增量 → 每项最新权威状态</text>
    <text x="800" y="820" text-anchor="middle" fill="#c4b5fd" font-size="19">注意力压缩：持续变化 → 少数需要模型判断的时刻</text>
  </g>
</svg>
