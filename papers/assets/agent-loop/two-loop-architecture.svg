<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">StarCut Video Agent Loop 总体架构</title>
  <desc id="desc">Vercel AI SDK ToolLoopAgent 运行一次短暂内循环，StarCut 的消息入口、Inbox、WaitPort、Monitor、Lease、Task 和浏览器 Editor 组成持久外循环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#151127"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1070" cy="440" r="360" fill="#2563eb" opacity="0.04"/>
  <text x="800" y="62" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="700" font-family="Inter, PingFang SC, sans-serif">StarCut Video Agent Loop</text>
  <text x="800" y="100" text-anchor="middle" fill="#94a3b8" font-size="21" font-family="Inter, PingFang SC, sans-serif">短暂内循环运行模型与工具 · 持久外循环承接整个创作过程</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="70" y="158" fill="#94a3b8" font-size="17" font-weight="700" letter-spacing="2">后来发生的事实</text>
    <g filter="url(#shadow)">
      <rect x="55" y="182" width="215" height="70" rx="16" fill="#10243a" stroke="#38bdf8" stroke-opacity="0.7"/>
      <rect x="55" y="270" width="215" height="70" rx="16" fill="#10243a" stroke="#38bdf8" stroke-opacity="0.7"/>
      <rect x="55" y="358" width="215" height="70" rx="16" fill="#10243a" stroke="#38bdf8" stroke-opacity="0.7"/>
      <rect x="55" y="446" width="215" height="70" rx="16" fill="#10243a" stroke="#38bdf8" stroke-opacity="0.7"/>
      <rect x="55" y="534" width="215" height="70" rx="16" fill="#10243a" stroke="#38bdf8" stroke-opacity="0.7"/>
    </g>
    <text x="162" y="225" text-anchor="middle" fill="#e0f2fe" font-size="20">用户消息</text>
    <text x="162" y="313" text-anchor="middle" fill="#e0f2fe" font-size="20">Task Update</text>
    <text x="162" y="401" text-anchor="middle" fill="#e0f2fe" font-size="20">时间事件</text>
    <text x="162" y="489" text-anchor="middle" fill="#e0f2fe" font-size="20">客户端结果</text>
    <text x="162" y="577" text-anchor="middle" fill="#e0f2fe" font-size="20">外部 MCP 调用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="138" width="1235" height="625" rx="38" fill="#111a2e" stroke="url(#violet)" stroke-width="3"/>
  </g>
  <text x="350" y="183" fill="#e9d5ff" font-size="25" font-weight="700" font-family="Inter, PingFang SC, sans-serif">外循环 · StarCut 持久运行时</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="355" y="225" width="245" height="112" rx="22" fill="#18243b" stroke="#a78bfa" stroke-width="2"/>
    <text x="477" y="268" text-anchor="middle" fill="#ddd6fe" font-size="22" font-weight="700">消息入口</text>
    <text x="477" y="302" text-anchor="middle" fill="#a5b4fc" font-size="17">内部 Session / 外部项目</text>

    <rect x="355" y="382" width="245" height="150" rx="22" fill="#122941" stroke="#38bdf8" stroke-width="2"/>
    <text x="477" y="426" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="700">统一 Inbox</text>
    <text x="477" y="462" text-anchor="middle" fill="#cbd5e1" font-size="16">message · context</text>
    <text x="477" y="491" text-anchor="middle" fill="#cbd5e1" font-size="16">tool result · task update</text>

    <rect x="355" y="580" width="245" height="112" rx="22" fill="#1b2238" stroke="#c084fc" stroke-width="2"/>
    <text x="477" y="623" text-anchor="middle" fill="#e9d5ff" font-size="21" font-weight="700">Run Lease 与恢复</text>
    <text x="477" y="657" text-anchor="middle" fill="#a5b4fc" font-size="16">选择唯一 Session Worker</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="685" y="215" width="800" height="445" rx="34" fill="#13233b" stroke="url(#cyan)" stroke-width="3"/>
  </g>
  <text x="725" y="263" fill="#bae6fd" font-size="25" font-weight="700" font-family="Inter, PingFang SC, sans-serif">内循环 · 一次 Session Run</text>
  <text x="1440" y="260" text-anchor="end" fill="#7dd3fc" font-size="17" font-family="Inter, PingFang SC, sans-serif">Vercel AI SDK 7 · ToolLoopAgent</text>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="745" y="318" width="175" height="96" rx="20" fill="#172b46" stroke="#38bdf8" stroke-width="2"/>
    <rect x="970" y="318" width="175" height="96" rx="20" fill="#202044" stroke="#a78bfa" stroke-width="2"/>
    <rect x="1195" y="318" width="215" height="96" rx="20" fill="#172b46" stroke="#38bdf8" stroke-width="2"/>
    <text x="832" y="358" text-anchor="middle" fill="#e0f2fe" font-size="20" font-weight="700">构建上下文</text>
    <text x="832" y="387" text-anchor="middle" fill="#94a3b8" font-size="15">历史 · 记忆 · 项目</text>
    <text x="1057" y="358" text-anchor="middle" fill="#ede9fe" font-size="20" font-weight="700">模型判断</text>
    <text x="1057" y="387" text-anchor="middle" fill="#a5b4fc" font-size="15">回答或 Tool Call</text>
    <text x="1302" y="358" text-anchor="middle" fill="#e0f2fe" font-size="20" font-weight="700">执行 Tool</text>
    <text x="1302" y="387" text-anchor="middle" fill="#94a3b8" font-size="15">Server / Client / Task</text>

    <rect x="970" y="490" width="260" height="98" rx="22" fill="#142c38" stroke="#34d399" stroke-width="2"/>
    <text x="1100" y="530" text-anchor="middle" fill="#a7f3d0" font-size="21" font-weight="700">Tool Result</text>
    <text x="1100" y="559" text-anchor="middle" fill="#94a3b8" font-size="15">继续下一 Step 或结束</text>
  </g>

  <path d="M920 366H960" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M1145 366H1185" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M1302 414C1302 455 1255 505 1235 520" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M970 539C905 539 894 438 1020 418" fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrowViolet)"/>

  <path d="M270 217H345" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M270 305C310 305 320 270 355 270" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M270 393C320 393 322 295 355 295" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M270 481C320 481 322 320 355 320" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M270 569C310 569 320 310 355 310" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M477 337V372" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
  <path d="M477 532V570" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
  <path d="M600 636C650 636 655 420 685 405" fill="none" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowViolet)"/>
  <path d="M685 470C642 470 633 455 610 455" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrowCyan)"/>

  <g font-family="Inter, PingFang SC, sans-serif" filter="url(#shadow)">
    <rect x="70" y="815" width="310" height="110" rx="24" fill="#102a2d" stroke="#34d399" stroke-width="2"/>
    <text x="225" y="858" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="700">权威 Task</text>
    <text x="225" y="890" text-anchor="middle" fill="#94a3b8" font-size="16">生成 · 转写 · 后台工作</text>

    <rect x="430" y="815" width="310" height="110" rx="24" fill="#15263b" stroke="#38bdf8" stroke-width="2"/>
    <text x="585" y="858" text-anchor="middle" fill="#bae6fd" font-size="22" font-weight="700">WaitPort · Monitor</text>
    <text x="585" y="890" text-anchor="middle" fill="#94a3b8" font-size="16">关联结果 · 聚合变化</text>

    <rect x="790" y="815" width="310" height="110" rx="24" fill="#202044" stroke="#a78bfa" stroke-width="2"/>
    <text x="945" y="858" text-anchor="middle" fill="#ede9fe" font-size="22" font-weight="700">Session 历史</text>
    <text x="945" y="890" text-anchor="middle" fill="#94a3b8" font-size="16">完整 UIMessage · 压缩 · 记忆</text>

    <rect x="1150" y="815" width="380" height="110" rx="24" fill="#102a2d" stroke="#34d399" stroke-width="2"/>
    <text x="1340" y="858" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="700">浏览器 Editor 与项目模型</text>
    <text x="1340" y="890" text-anchor="middle" fill="#94a3b8" font-size="16">SSE / WebSocket · Client Lease</text>
  </g>

  <path d="M380 870H420" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M585 815C585 780 520 755 500 700" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M945 815C945 760 900 710 900 660" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
  <path d="M1340 815C1340 760 1340 700 1340 660" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M1410 470C1490 500 1500 745 1430 815" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrowCyan)"/>
</svg>
