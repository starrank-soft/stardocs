<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">StarCut Video Agent Loop 基本结构</title>
  <desc id="desc">一次短暂的模型与工具循环运行在持续存在的创作过程之中。用户要求、媒体完成、项目变化和编辑器结果会在需要时启动下一次运行，项目、后台工作和创作记录持续存在。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#171229"/>
    </linearGradient>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d32"/>
      <stop offset="1" stop-color="#191833"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e3147"/>
      <stop offset="1" stop-color="#27204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <circle cx="1260" cy="330" r="320" fill="#2563eb" opacity="0.04"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700">StarCut Video Agent Loop</text>
    <text x="800" y="103" text-anchor="middle" fill="#94a3b8" font-size="21">一次 Run 处理当前工作 · 整个创作过程跨越等待、变化与再次行动</text>
  </g>

  <rect x="70" y="140" width="1460" height="690" rx="42" fill="url(#outer)" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="115" y="192" fill="#e9d5ff" font-size="27" font-weight="700">外循环 · 持续存在的创作过程</text>
    <text x="1485" y="192" text-anchor="end" fill="#a5b4fc" font-size="17">平时可以没有模型运行</text>

    <text x="115" y="250" fill="#94a3b8" font-size="17" font-weight="700" letter-spacing="2">后来发生的事情</text>
    <g filter="url(#shadow)">
      <rect x="115" y="272" width="285" height="68" rx="18" fill="#102b40" stroke="#38bdf8"/>
      <rect x="445" y="272" width="285" height="68" rx="18" fill="#102b40" stroke="#38bdf8"/>
      <rect x="775" y="272" width="285" height="68" rx="18" fill="#2a2245" stroke="#a78bfa"/>
      <rect x="1105" y="272" width="310" height="68" rx="18" fill="#2a2245" stroke="#a78bfa"/>
    </g>
    <text x="257" y="314" text-anchor="middle" fill="#e0f2fe" font-size="20">用户提出新要求</text>
    <text x="587" y="314" text-anchor="middle" fill="#e0f2fe" font-size="20">图片或视频完成</text>
    <text x="917" y="314" text-anchor="middle" fill="#ede9fe" font-size="20">项目被继续修改</text>
    <text x="1260" y="314" text-anchor="middle" fill="#ede9fe" font-size="20">编辑器返回执行结果</text>

    <path d="M257 340C257 378 395 378 470 405" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <path d="M587 340V395" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <path d="M917 340V395" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
    <path d="M1260 340C1260 378 1150 378 1085 405" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
  </g>

  <rect x="270" y="400" width="1060" height="245" rx="34" fill="url(#inner)" stroke="url(#accent)" stroke-width="3" filter="url(#shadow)"/>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="315" y="447" fill="#bae6fd" font-size="25" font-weight="700">内循环 · 一次可以连续完成的 Run</text>
    <text x="1285" y="445" text-anchor="end" fill="#7dd3fc" font-size="17">Vercel AI SDK · ToolLoopAgent</text>

    <g filter="url(#shadow)">
      <rect x="330" y="495" width="205" height="92" rx="21" fill="#15364b" stroke="#38bdf8"/>
      <rect x="585" y="495" width="180" height="92" rx="21" fill="#242044" stroke="#a78bfa"/>
      <rect x="815" y="495" width="180" height="92" rx="21" fill="#15364b" stroke="#38bdf8"/>
      <rect x="1045" y="495" width="225" height="92" rx="21" fill="#19352f" stroke="#34d399"/>
    </g>
    <text x="432" y="532" text-anchor="middle" fill="#e0f2fe" font-size="20" font-weight="700">读取当前状态</text>
    <text x="432" y="562" text-anchor="middle" fill="#94a3b8" font-size="15">历史 · 项目 · 新输入</text>
    <text x="675" y="532" text-anchor="middle" fill="#ede9fe" font-size="20" font-weight="700">模型判断</text>
    <text x="675" y="562" text-anchor="middle" fill="#a5b4fc" font-size="15">回答或调用工具</text>
    <text x="905" y="532" text-anchor="middle" fill="#e0f2fe" font-size="20" font-weight="700">执行工具</text>
    <text x="905" y="562" text-anchor="middle" fill="#94a3b8" font-size="15">服务端或编辑器</text>
    <text x="1157" y="532" text-anchor="middle" fill="#d1fae5" font-size="20" font-weight="700">获得结果</text>
    <text x="1157" y="562" text-anchor="middle" fill="#94a3b8" font-size="15">继续判断或结束</text>

    <path d="M535 541H575" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <path d="M765 541H805" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowViolet)"/>
    <path d="M995 541H1035" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowCyan)"/>
    <path d="M1157 587C1157 625 675 625 675 597" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrowCyan)"/>

    <text x="115" y="704" fill="#94a3b8" font-size="17" font-weight="700" letter-spacing="2">Run 结束以后仍然存在</text>
    <g filter="url(#shadow)">
      <rect x="115" y="727" width="400" height="66" rx="19" fill="#12332f" stroke="#34d399"/>
      <rect x="600" y="727" width="400" height="66" rx="19" fill="#102b40" stroke="#38bdf8"/>
      <rect x="1085" y="727" width="330" height="66" rx="19" fill="#2a2245" stroke="#a78bfa"/>
    </g>
    <text x="315" y="768" text-anchor="middle" fill="#d1fae5" font-size="20">当前视频项目</text>
    <text x="800" y="768" text-anchor="middle" fill="#e0f2fe" font-size="20">仍在进行的后台工作</text>
    <text x="1250" y="768" text-anchor="middle" fill="#ede9fe" font-size="20">创作记录</text>
  </g>

  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="300" y="854" width="1000" height="44" rx="22" fill="#101b2d" stroke="#475569"/>
    <text x="800" y="883" text-anchor="middle" fill="#cbd5e1" font-size="18">新的事情出现时，再读取当前状态并启动下一次 Run</text>
  </g>
</svg>
