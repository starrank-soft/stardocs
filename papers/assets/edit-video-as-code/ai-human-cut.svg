<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Cut 与 Human Cut 的差距</title>
  <desc id="desc">三个都合法的剪点落在动作的不同相位，只有结合连续运动、声音和上下文才能判断哪个更合适。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071524"/><stop offset="1" stop-color="#1b1328"/></linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="0.55" stop-color="#f59e0b"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">合法剪点很多，合适剪点很少</text>
  <text x="800" y="112" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">DSL 能精确执行时间码，但不能单独决定运动、节奏与情绪</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="90" y="170" width="1420" height="370" rx="28" fill="#101a2b" stroke="#334155"/>
    <text x="140" y="220" fill="#e2e8f0" font-size="22" font-weight="700">动作强度 / 时间</text>
    <line x1="150" y1="460" x2="1450" y2="460" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="260" x2="150" y2="460" stroke="#475569" stroke-width="2"/>
    <path d="M160 440 C350 440 400 420 505 360 C610 300 660 245 790 235 C940 225 980 310 1080 370 C1180 430 1300 438 1440 440" fill="none" stroke="url(#curve)" stroke-width="12" stroke-linecap="round"/>

    <line x1="545" y1="244" x2="545" y2="480" stroke="#22d3ee" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="790" y1="210" x2="790" y2="480" stroke="#f59e0b" stroke-width="5"/>
    <line x1="1050" y1="244" x2="1050" y2="480" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="545" y="512" text-anchor="middle" fill="#67e8f9" font-size="19" font-weight="700">剪早：动作尚未兑现</text>
    <text x="790" y="512" text-anchor="middle" fill="#fcd34d" font-size="19" font-weight="700">动作点：连续感最强</text>
    <text x="1050" y="512" text-anchor="middle" fill="#fda4af" font-size="19" font-weight="700">剪晚：能量已经泄掉</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="90" y="590" width="430" height="220" rx="24" fill="#102b3a" stroke="#22d3ee"/>
    <text x="125" y="640" fill="#67e8f9" font-size="23" font-weight="700">工程接口</text>
    <text x="125" y="683" fill="#cbd5e1" font-size="19">找到节点、修改时间码</text>
    <text x="125" y="720" fill="#cbd5e1" font-size="19">保证结构合法、结果可撤销</text>
    <text x="125" y="765" fill="#a5f3fc" font-size="18">Edit Video as Code 主要解决</text>

    <rect x="585" y="590" width="430" height="220" rx="24" fill="#201b43" stroke="#8b5cf6"/>
    <text x="620" y="640" fill="#c4b5fd" font-size="23" font-weight="700">感知接口</text>
    <text x="620" y="683" fill="#cbd5e1" font-size="19">播放、seek、scrub、A/B 比较</text>
    <text x="620" y="720" fill="#cbd5e1" font-size="19">运动、声音与语义时间对齐</text>
    <text x="620" y="765" fill="#ddd6fe" font-size="18">让 Agent 真正“看见时间”</text>

    <rect x="1080" y="590" width="430" height="220" rx="24" fill="#382016" stroke="#f59e0b"/>
    <text x="1115" y="640" fill="#fcd34d" font-size="23" font-weight="700">剪辑判断</text>
    <text x="1115" y="683" fill="#cbd5e1" font-size="19">候选排序、节奏与情绪判断</text>
    <text x="1115" y="720" fill="#cbd5e1" font-size="19">人类偏好与过程数据学习</text>
    <text x="1115" y="765" fill="#fde68a" font-size="18">从“能改”走向“会剪”</text>
  </g>
</svg>
