<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从结构编辑走向剪辑判断的感知编辑闭环</title>
  <desc id="desc">Agent 主动播放、seek、scrub 和取样，形成时间对齐表征，提出候选，局部比较并结合人的偏好判断，再通过语义协议写回工程并继续观察。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17122a"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a78bfa"/></marker>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">剪辑智能来自闭环，不只来自写入工具</text>
  <text x="800" y="114" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">观察连续时间 → 生成候选 → 比较结果 → 修改工程 → 再观察</text>

  <circle cx="800" cy="475" r="250" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="18 10" opacity=".85"/>

  <g fill="none" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrow)">
    <path d="M590 265C675 190 755 176 830 188"/>
    <path d="M1038 258C1125 328 1150 408 1135 487"/>
    <path d="M1092 655C1018 733 930 760 846 750"/>
    <path d="M565 704C472 649 432 574 449 493"/>
    <path d="M462 368C485 315 520 284 566 257"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="440" y="170" width="300" height="150" rx="26" fill="#0e2b3a" stroke="#22d3ee" stroke-width="2"/>
    <text x="590" y="216" text-anchor="middle" fill="#67e8f9" font-size="23" font-weight="700">1. 主动观察</text>
    <text x="590" y="254" text-anchor="middle" fill="#dbeafe" font-size="18">play · seek · scrub</text>
    <text x="590" y="286" text-anchor="middle" fill="#94a3b8" font-size="17">围绕候选点扩大或缩小窗口</text>

    <rect x="850" y="170" width="330" height="150" rx="26" fill="#182445" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1015" y="216" text-anchor="middle" fill="#c4b5fd" font-size="23" font-weight="700">2. 时间对齐表征</text>
    <text x="1015" y="254" text-anchor="middle" fill="#ede9fe" font-size="18">运动 · 声音 · 语义</text>
    <text x="1015" y="286" text-anchor="middle" fill="#94a3b8" font-size="17">只检索当前判断所需证据</text>

    <rect x="1050" y="430" width="350" height="150" rx="26" fill="#302044" stroke="#a78bfa" stroke-width="2"/>
    <text x="1225" y="476" text-anchor="middle" fill="#ddd6fe" font-size="23" font-weight="700">3. 生成候选</text>
    <text x="1225" y="514" text-anchor="middle" fill="#ede9fe" font-size="18">附近剪点 · 多个时间线版本</text>
    <text x="1225" y="546" text-anchor="middle" fill="#94a3b8" font-size="17">保留不确定性，不急于单点决策</text>

    <rect x="810" y="675" width="380" height="150" rx="26" fill="#3a1d2e" stroke="#fb7185" stroke-width="2"/>
    <text x="1000" y="721" text-anchor="middle" fill="#fda4af" font-size="23" font-weight="700">4. 局部比较与判断</text>
    <text x="1000" y="759" text-anchor="middle" fill="#ffe4e6" font-size="18">A/B 播放 · 连贯性 · 节奏</text>
    <text x="1000" y="791" text-anchor="middle" fill="#94a3b8" font-size="17">模型评价与人的偏好共同参与</text>

    <rect x="390" y="675" width="340" height="150" rx="26" fill="#352411" stroke="#f59e0b" stroke-width="2"/>
    <text x="560" y="721" text-anchor="middle" fill="#fcd34d" font-size="23" font-weight="700">5. 语义写回</text>
    <text x="560" y="759" text-anchor="middle" fill="#fef3c7" font-size="18">修改同一权威工程</text>
    <text x="560" y="791" text-anchor="middle" fill="#94a3b8" font-size="17">结果立即成为下一轮观察对象</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <circle cx="800" cy="475" r="150" fill="#111827" stroke="url(#ring)" stroke-width="4"/>
    <text x="800" y="458" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="700">感知—编辑—评价</text>
    <text x="800" y="500" text-anchor="middle" fill="#cbd5e1" font-size="22">反馈闭环</text>
    <text x="800" y="542" text-anchor="middle" fill="#94a3b8" font-size="17">结构合法 ≠ 剪辑合适</text>
  </g>
</svg>
