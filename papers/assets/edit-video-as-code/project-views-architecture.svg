<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">一个项目，两种工作界面</title>
  <desc id="desc">Coding Agent 通过虚拟文件接口，人类通过时间线界面，共同操作同一权威项目模型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="1" stop-color="#11152c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowWarm" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#fb7185"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="520" r="330" fill="#7c3aed" opacity="0.06"/>
  <text x="800" y="72" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">一个项目，两种工作界面</text>
  <text x="800" y="112" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">文件是 Agent 的接口，不是第二份业务状态</text>

  <g filter="url(#shadow)">
    <rect x="80" y="170" width="560" height="400" rx="28" fill="#0f2039" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="960" y="170" width="560" height="400" rx="28" fill="#24182e" stroke="#fb7185" stroke-opacity="0.65" stroke-width="2"/>
  </g>

  <text x="124" y="222" fill="#67e8f9" font-size="25" font-weight="700" font-family="Inter, PingFang SC, sans-serif">CODING AGENT</text>
  <text x="1004" y="222" fill="#fda4af" font-size="25" font-weight="700" font-family="Inter, PingFang SC, sans-serif">HUMAN EDITOR</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="124" y="250" width="220" height="270" rx="18" fill="#0a172b" stroke="#28486b"/>
    <text x="154" y="292" fill="#e2e8f0" font-size="20">project.json</text>
    <text x="154" y="338" fill="#7dd3fc" font-size="20">assets/</text>
    <text x="184" y="374" fill="#cbd5e1" font-size="17">product.mp4</text>
    <text x="154" y="420" fill="#a78bfa" font-size="20">docs/</text>
    <text x="184" y="456" fill="#cbd5e1" font-size="17">script.md</text>
    <text x="154" y="502" fill="#f0abfc" font-size="20">compositions/</text>

    <rect x="372" y="250" width="224" height="68" rx="14" fill="#10314a" stroke="#38bdf8"/>
    <text x="398" y="292" fill="#e0f2fe" font-size="19" font-weight="700">glob · grep · read</text>
    <rect x="372" y="338" width="224" height="122" rx="14" fill="#201a44" stroke="#8b5cf6"/>
    <text x="398" y="376" fill="#ddd6fe" font-size="18" font-weight="700">PATCH #clip</text>
    <text x="398" y="410" fill="#c4b5fd" font-size="17">duration="3s"</text>
    <text x="398" y="442" fill="#c4b5fd" font-size="17">opacity="0.8"</text>
    <rect x="372" y="480" width="224" height="40" rx="12" fill="#123044"/>
    <text x="484" y="506" text-anchor="middle" fill="#67e8f9" font-size="17">局部、语义化修改</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="1004" y="250" width="472" height="170" rx="18" fill="#0d1726" stroke="#5e3850"/>
    <rect x="1028" y="276" width="424" height="112" rx="12" fill="#172033"/>
    <circle cx="1240" cy="332" r="34" fill="#f59e0b" opacity="0.95"/>
    <path d="M1170 360 Q1240 275 1310 360" fill="none" stroke="#fb7185" stroke-width="10" stroke-linecap="round"/>
    <rect x="1004" y="440" width="472" height="80" rx="14" fill="#101827"/>
    <rect x="1028" y="458" width="120" height="20" rx="6" fill="#fb7185"/>
    <rect x="1158" y="458" width="88" height="20" rx="6" fill="#f59e0b"/>
    <rect x="1256" y="458" width="156" height="20" rx="6" fill="#8b5cf6"/>
    <rect x="1028" y="488" width="190" height="16" rx="5" fill="#22c55e"/>
    <rect x="1228" y="488" width="184" height="16" rx="5" fill="#06b6d4"/>
    <line x1="1270" y1="446" x2="1270" y2="512" stroke="#67e8f9" stroke-width="3"/>
  </g>

  <path d="M360 598 C470 680 555 710 680 726" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M1240 598 C1130 680 1045 710 920 726" fill="none" stroke="#fb7185" stroke-width="5" marker-end="url(#arrowWarm)"/>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="510" y="680" width="580" height="150" rx="30" fill="#151b35" stroke="url(#cyan)" stroke-width="3"/>
    <text x="800" y="730" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">权威项目模型</text>
    <text x="800" y="770" text-anchor="middle" fill="#cbd5e1" font-size="20">稳定节点身份 · 领域约束 · 协同状态 · 素材引用</text>
    <rect x="650" y="792" width="300" height="18" rx="9" fill="url(#cyan)" opacity="0.9"/>
  </g>
</svg>
