<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Agent 写入、人类接管与再次读取的完整时序</title>
  <desc id="desc">Agent 经虚拟文件接口和编辑协议验证写入权威项目状态。验证失败时状态不变；成功时人类编辑器观察更新并可继续编辑同一节点，Agent 下一次读取会得到包含人类修改的最新投影。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071827"/>
      <stop offset="1" stop-color="#17122a"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#fb7185"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="800" y="64" text-anchor="middle" fill="#f8fafc" font-size="39" font-weight="700" font-family="Inter, PingFang SC, sans-serif">一次修改如何进入同一工程，并由人类继续接管</text>
  <text x="800" y="104" text-anchor="middle" fill="#94a3b8" font-size="21" font-family="Inter, PingFang SC, sans-serif">失败不写入，成功后双方继续读写同一份权威状态</text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <g fill="#111c2d" stroke-width="2">
      <rect x="70" y="130" width="250" height="86" rx="20" stroke="#38bdf8"/>
      <rect x="370" y="130" width="260" height="86" rx="20" stroke="#38bdf8"/>
      <rect x="680" y="130" width="260" height="86" rx="20" stroke="#8b5cf6"/>
      <rect x="990" y="130" width="260" height="86" rx="20" stroke="#fb7185"/>
      <rect x="1300" y="130" width="230" height="86" rx="20" stroke="#f59e0b"/>
    </g>
    <text x="195" y="182" text-anchor="middle" fill="#67e8f9" font-size="22" font-weight="700">AI Agent</text>
    <text x="500" y="170" text-anchor="middle" fill="#7dd3fc" font-size="20" font-weight="700">虚拟文件接口</text>
    <text x="500" y="198" text-anchor="middle" fill="#94a3b8" font-size="16">发现、读取与统一编辑入口</text>
    <text x="810" y="170" text-anchor="middle" fill="#c4b5fd" font-size="20" font-weight="700">投影与编辑协议</text>
    <text x="810" y="198" text-anchor="middle" fill="#94a3b8" font-size="16">解析、领域验证与结果表达</text>
    <text x="1120" y="170" text-anchor="middle" fill="#fda4af" font-size="20" font-weight="700">权威项目状态</text>
    <text x="1120" y="198" text-anchor="middle" fill="#94a3b8" font-size="16">事务、协同与唯一业务状态</text>
    <text x="1415" y="182" text-anchor="middle" fill="#fcd34d" font-size="21" font-weight="700">人类编辑器</text>
  </g>

  <g stroke="#334155" stroke-width="3" stroke-dasharray="10 12">
    <line x1="195" y1="230" x2="195" y2="1025"/>
    <line x1="500" y1="230" x2="500" y2="1025"/>
    <line x1="810" y1="230" x2="810" y2="1025"/>
    <line x1="1120" y1="230" x2="1120" y2="1025"/>
    <line x1="1415" y1="230" x2="1415" y2="1025"/>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="42" y="252" width="1516" height="500" rx="26" fill="#0f172a" fill-opacity="0.52" stroke="#26364d"/>
    <rect x="62" y="270" width="150" height="34" rx="17" fill="#172554"/>
    <text x="137" y="293" text-anchor="middle" fill="#bfdbfe" font-size="16" font-weight="700">Agent 写入</text>

    <rect x="42" y="776" width="1516" height="260" rx="26" fill="#0f172a" fill-opacity="0.52" stroke="#26364d"/>
    <rect x="62" y="794" width="220" height="34" rx="17" fill="#422006"/>
    <text x="172" y="817" text-anchor="middle" fill="#fde68a" font-size="16" font-weight="700">人类接管与再次读取</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif" font-size="17">
    <path d="M212 330H482" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <circle cx="195" cy="330" r="19" fill="#0e7490"/>
    <text x="195" y="336" text-anchor="middle" fill="#fff" font-weight="700">1</text>
    <text x="345" y="313" text-anchor="middle" fill="#dbeafe">edit(path, changes)</text>

    <path d="M517 392H792" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <circle cx="500" cy="392" r="19" fill="#0369a1"/>
    <text x="500" y="398" text-anchor="middle" fill="#fff" font-weight="700">2</text>
    <text x="650" y="375" text-anchor="middle" fill="#dbeafe">按资源类型进入对应协议</text>

    <rect x="702" y="425" width="216" height="60" rx="16" fill="#2e1065" stroke="#8b5cf6"/>
    <circle cx="730" cy="455" r="18" fill="#7c3aed"/>
    <text x="730" y="461" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <text x="818" y="449" text-anchor="middle" fill="#ede9fe" font-size="16">解析目标与操作</text>
    <text x="818" y="472" text-anchor="middle" fill="#c4b5fd" font-size="15">验证模式、关系和引用</text>

    <path d="M792 510H517M482 510H212" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowPurple)"/>
    <text x="500" y="496" text-anchor="middle" fill="#c4b5fd" font-size="15">未通过：返回可定位诊断，权威状态不变</text>

    <path d="M827 565H1102" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrowPurple)"/>
    <circle cx="810" cy="565" r="19" fill="#7c3aed"/>
    <text x="810" y="571" text-anchor="middle" fill="#fff" font-weight="700">4</text>
    <text x="960" y="548" text-anchor="middle" fill="#ede9fe">验证通过：在事务中提交</text>

    <path d="M1102 625H827" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrowPink)"/>
    <circle cx="1120" cy="625" r="19" fill="#e11d48"/>
    <text x="1120" y="631" text-anchor="middle" fill="#fff" font-weight="700">5</text>
    <text x="960" y="608" text-anchor="middle" fill="#ffe4e6">提交结果与新节点 ID</text>

    <path d="M792 683H517M482 683H212" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <circle cx="810" cy="683" r="19" fill="#7c3aed"/>
    <text x="810" y="689" text-anchor="middle" fill="#fff" font-weight="700">6</text>
    <text x="650" y="666" text-anchor="middle" fill="#dbeafe">结构化结果</text>
    <text x="345" y="666" text-anchor="middle" fill="#dbeafe">edit result</text>

    <path d="M1138 725H1397" stroke="#fb7185" stroke-width="5" marker-end="url(#arrowPink)"/>
    <circle cx="1120" cy="725" r="19" fill="#e11d48"/>
    <text x="1120" y="731" text-anchor="middle" fill="#fff" font-weight="700">7</text>
    <text x="1268" y="708" text-anchor="middle" fill="#ffe4e6">observe(update)：时间线与预览刷新</text>

    <path d="M1397 855H1138" stroke="#fbbf24" stroke-width="5" marker-end="url(#arrowAmber)"/>
    <circle cx="1415" cy="855" r="19" fill="#d97706"/>
    <text x="1415" y="861" text-anchor="middle" fill="#fff" font-weight="700">8</text>
    <text x="1268" y="838" text-anchor="middle" fill="#fef3c7">继续编辑同一节点</text>

    <path d="M212 910H482" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <circle cx="195" cy="910" r="19" fill="#0e7490"/>
    <text x="195" y="916" text-anchor="middle" fill="#fff" font-weight="700">9</text>
    <text x="345" y="893" text-anchor="middle" fill="#dbeafe">read(path#id)</text>

    <path d="M517 966H1102" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <circle cx="500" cy="966" r="19" fill="#0369a1"/>
    <text x="500" y="972" text-anchor="middle" fill="#fff" font-weight="700">10</text>
    <text x="810" y="949" text-anchor="middle" fill="#dbeafe">从当前权威状态读取，不经过写协议</text>

    <path d="M1102 1012H517M482 1012H212" fill="none" stroke="#67e8f9" stroke-width="5" marker-end="url(#arrowCyan)"/>
    <circle cx="1120" cy="1012" r="19" fill="#e11d48"/>
    <text x="1120" y="1018" text-anchor="middle" fill="#fff" font-weight="700">11</text>
    <text x="810" y="995" text-anchor="middle" fill="#dbeafe">最新节点子树</text>
    <text x="345" y="995" text-anchor="middle" fill="#dbeafe">包含人类修改的 VML 投影</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="210" y="1054" width="1180" height="46" rx="18" fill="#111827" stroke="#334155"/>
    <text x="800" y="1084" text-anchor="middle" fill="#cbd5e1" font-size="18">文件视图没有保存第二份项目；每一次写入与读取都回到同一份权威状态。</text>
  </g>
</svg>
