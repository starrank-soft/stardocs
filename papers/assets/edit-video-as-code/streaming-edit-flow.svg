<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">流式编辑协议的执行流程</title>
  <desc id="desc">连续且语义完整的操作被渐进执行，传输缺口暂停消费，最终输入补齐后缀并闭合解析。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#17122a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="74" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">模型还在输出，完整操作已经可以生效</text>
  <text x="800" y="116" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">消费连续前缀，只在完整语义边界执行</text>

  <line x1="130" y1="250" x2="1470" y2="250" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter, PingFang SC, sans-serif">
    <circle cx="180" cy="250" r="18" fill="#22d3ee"/><text x="180" y="205" text-anchor="middle" fill="#67e8f9" font-size="20">路径到达</text>
    <circle cx="470" cy="250" r="18" fill="#38bdf8"/><text x="470" y="205" text-anchor="middle" fill="#7dd3fc" font-size="20">PATCH 完整</text>
    <circle cx="760" cy="250" r="18" fill="#8b5cf6"/><text x="760" y="205" text-anchor="middle" fill="#c4b5fd" font-size="20">属性行完整</text>
    <circle cx="1030" cy="250" r="18" fill="#f59e0b"/><text x="1030" y="205" text-anchor="middle" fill="#fcd34d" font-size="20">实时片段缺口</text>
    <circle cx="1400" cy="250" r="18" fill="#fb7185"/><text x="1400" y="205" text-anchor="middle" fill="#fda4af" font-size="20">最终输入闭合</text>

    <rect x="90" y="330" width="270" height="170" rx="22" fill="#102b3a" stroke="#22d3ee"/>
    <text x="120" y="374" fill="#67e8f9" font-size="20" font-weight="700">1. 选择处理语义</text>
    <text x="120" y="414" fill="#cbd5e1" font-size="18">path 先确定文件类型</text>
    <text x="120" y="450" fill="#cbd5e1" font-size="18">建立一次解析上下文</text>

    <rect x="400" y="330" width="420" height="170" rx="22" fill="#171e42" stroke="#8b5cf6"/>
    <text x="430" y="374" fill="#c4b5fd" font-size="20" font-weight="700">2. 渐进解析并执行</text>
    <text x="430" y="414" fill="#e2e8f0" font-size="18">PATCH #clip_product</text>
    <text x="430" y="450" fill="#e2e8f0" font-size="18">opacity="0.8"  ✓ 写入</text>

    <rect x="860" y="330" width="300" height="170" rx="22" fill="#352411" stroke="#f59e0b"/>
    <text x="890" y="374" fill="#fcd34d" font-size="20" font-weight="700">3. 缺口时暂停</text>
    <text x="890" y="414" fill="#fde68a" font-size="18">不消费非连续后缀</text>
    <text x="890" y="450" fill="#fde68a" font-size="18">不猜测缺失上下文</text>

    <rect x="1200" y="330" width="310" height="170" rx="22" fill="#371a2d" stroke="#fb7185"/>
    <text x="1230" y="374" fill="#fda4af" font-size="20" font-weight="700">4. 补齐并完成</text>
    <text x="1230" y="414" fill="#fecdd3" font-size="18">补齐未消费后缀</text>
    <text x="1230" y="450" fill="#fecdd3" font-size="18">已执行前缀不重放</text>
  </g>

  <path d="M360 415H390" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M820 415H850" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1160 415H1190" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="140" y="590" width="1320" height="178" rx="28" fill="#111827" stroke="#334155"/>
    <text x="190" y="642" fill="#f8fafc" font-size="23" font-weight="700">边界说明</text>
    <circle cx="204" cy="690" r="8" fill="#22d3ee"/><text x="228" y="697" fill="#cbd5e1" font-size="19">低延迟来自语义完成边界，不来自跳过验证</text>
    <circle cx="204" cy="732" r="8" fill="#fb7185"/><text x="228" y="739" fill="#cbd5e1" font-size="19">最终输入不是原子事务点；后续失败不代表前缀自动回滚</text>
  </g>
</svg>
