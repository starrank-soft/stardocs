<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VML 从公共表达进入权威结构状态的验证管线</title>
  <desc id="desc">公共 VML 先经过标签与属性解析，再经过节点模式、父子关系和素材引用三类领域验证，全部通过后才修改权威结构状态；失败则返回可定位诊断且不写入状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071827"/>
      <stop offset="1" stop-color="#17122a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#a78bfa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="700" font-family="Inter, PingFang SC, sans-serif">从可读 VML 到可执行结构修改</text>
  <text x="800" y="114" text-anchor="middle" fill="#94a3b8" font-size="22" font-family="Inter, PingFang SC, sans-serif">语法负责被理解，领域验证决定能否进入权威状态</text>

  <path d="M310 410H360M610 410H680M1200 410H1280" fill="none" stroke="url(#flow)" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect x="70" y="220" width="240" height="380" rx="28" fill="#0c2032" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="112" cy="266" r="20" fill="#0e7490"/>
    <text x="112" y="273" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
    <text x="145" y="274" fill="#67e8f9" font-size="23" font-weight="700">公共 VML</text>
    <rect x="102" y="322" width="176" height="190" rx="18" fill="#071422" stroke="#27445c"/>
    <g fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <text x="122" y="370">&lt;VideoClip</text>
      <text x="140" y="410" fill="#c4b5fd">source="..."</text>
      <text x="140" y="450" fill="#fda4af">duration="..."</text>
      <text x="122" y="490">/&gt;</text>
    </g>
    <text x="190" y="556" text-anchor="middle" fill="#94a3b8" font-size="17">面向 Agent 的</text>
    <text x="190" y="582" text-anchor="middle" fill="#94a3b8" font-size="17">领域表达</text>

    <rect x="360" y="220" width="250" height="380" rx="28" fill="#111c32" stroke="#818cf8" stroke-width="2"/>
    <circle cx="402" cy="266" r="20" fill="#4f46e5"/>
    <text x="402" y="273" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
    <text x="435" y="274" fill="#c4b5fd" font-size="23" font-weight="700">结构解析</text>
    <rect x="396" y="330" width="178" height="72" rx="18" fill="#1e1b4b" stroke="#8b5cf6"/>
    <text x="485" y="374" text-anchor="middle" fill="#ede9fe" font-size="19">标签识别</text>
    <rect x="396" y="430" width="178" height="72" rx="18" fill="#1e1b4b" stroke="#8b5cf6"/>
    <text x="485" y="474" text-anchor="middle" fill="#ede9fe" font-size="19">属性解析</text>
    <text x="485" y="556" text-anchor="middle" fill="#94a3b8" font-size="17">把文本转换为</text>
    <text x="485" y="582" text-anchor="middle" fill="#94a3b8" font-size="17">候选领域操作</text>

    <rect x="680" y="180" width="520" height="460" rx="32" fill="#21182f" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="726" cy="226" r="20" fill="#7c3aed"/>
    <text x="726" y="233" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
    <text x="760" y="234" fill="#ddd6fe" font-size="24" font-weight="700">领域验证门</text>
    <text x="1148" y="232" text-anchor="end" fill="#a78bfa" font-size="17">全部通过</text>

    <rect x="726" y="286" width="428" height="82" rx="20" fill="#2e1f47" stroke="#8b5cf6"/>
    <circle cx="770" cy="327" r="13" fill="#8b5cf6"/>
    <text x="804" y="335" fill="#f5f3ff" font-size="21" font-weight="700">领域节点模式</text>
    <text x="1120" y="335" text-anchor="end" fill="#c4b5fd" font-size="17">类型 · 属性 · 约束</text>

    <rect x="726" y="394" width="428" height="82" rx="20" fill="#2e1f47" stroke="#8b5cf6"/>
    <circle cx="770" cy="435" r="13" fill="#8b5cf6"/>
    <text x="804" y="443" fill="#f5f3ff" font-size="21" font-weight="700">父子关系</text>
    <text x="1120" y="443" text-anchor="end" fill="#c4b5fd" font-size="17">归属 · 层级 · 顺序</text>

    <rect x="726" y="502" width="428" height="82" rx="20" fill="#2e1f47" stroke="#8b5cf6"/>
    <circle cx="770" cy="543" r="13" fill="#8b5cf6"/>
    <text x="804" y="551" fill="#f5f3ff" font-size="21" font-weight="700">素材引用</text>
    <text x="1120" y="551" text-anchor="end" fill="#c4b5fd" font-size="17">存在性 · 类型兼容</text>

    <rect x="1280" y="220" width="250" height="380" rx="28" fill="#301a29" stroke="#fb7185" stroke-width="2"/>
    <circle cx="1322" cy="266" r="20" fill="#e11d48"/>
    <text x="1322" y="273" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text>
    <text x="1355" y="263" fill="#fda4af" font-size="22" font-weight="700">权威结构</text>
    <text x="1355" y="291" fill="#fda4af" font-size="22" font-weight="700">状态修改</text>
    <g stroke-width="3">
      <line x1="1405" y1="385" x2="1355" y2="455" stroke="#8b5cf6"/>
      <line x1="1405" y1="385" x2="1455" y2="455" stroke="#8b5cf6"/>
      <circle cx="1405" cy="370" r="42" fill="#3b2454" stroke="#a78bfa"/>
      <circle cx="1355" cy="470" r="38" fill="#18344a" stroke="#38bdf8"/>
      <circle cx="1455" cy="470" r="38" fill="#3a1d2e" stroke="#fb7185"/>
    </g>
    <text x="1405" y="376" text-anchor="middle" fill="#ede9fe" font-size="15">Track</text>
    <text x="1355" y="476" text-anchor="middle" fill="#dbeafe" font-size="15">Clip</text>
    <text x="1455" y="476" text-anchor="middle" fill="#ffe4e6" font-size="15">Clip</text>
    <text x="1405" y="556" text-anchor="middle" fill="#cbd5e1" font-size="17">保留稳定身份</text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect x="250" y="724" width="1100" height="92" rx="24" fill="#111827" stroke="#334155"/>
    <circle cx="304" cy="770" r="11" fill="#fb7185"/>
    <text x="336" y="764" fill="#e2e8f0" font-size="21" font-weight="700">验证是写入边界</text>
    <text x="336" y="794" fill="#94a3b8" font-size="18">任一步失败都返回可定位诊断，并保持权威状态不变。</text>
  </g>
</svg>
