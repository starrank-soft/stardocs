<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">StarCut 统一解码管线</title>
  <desc id="desc">Web 与 Tauri 将 HTTP、OPFS 和本地文件适配为统一媒体来源，SCIX 索引与 Range 读取把压缩 GOP 送入 Video Worker，GOP Flight 通过 WebCodecs 解码，VideoFrame 进入缓存、缩略图与 OffscreenCanvas GPU 合成。编辑器通过 Control SAB 向 Worker 发布最新时序状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1e31"/></linearGradient>
    <linearGradient id="runtime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10283d"/><stop offset="1" stop-color="#12364a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d8ff"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e1ad"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="70" y="72" fill="#eef8ff" font-size="34" font-weight="800" font-family="system-ui, sans-serif">StarCut 统一解码管线</text>
  <text x="70" y="112" fill="#8facbf" font-size="19" font-family="system-ui, sans-serif">Web 与 Tauri 只适配媒体来源；索引、调度、硬件解码与 GPU 呈现共享同一套实现。</text>

  <g font-family="system-ui, sans-serif">
    <rect x="70" y="150" width="1300" height="500" rx="30" fill="url(#runtime)" stroke="#3c6b83" stroke-width="2"/>
    <text x="106" y="195" fill="#bdeeff" font-size="16" font-weight="700">SHARED VIDEO RUNTIME</text>
    <g text-anchor="middle" font-size="14" font-weight="700">
      <rect x="1132" y="172" width="84" height="34" rx="11" fill="#0d2234" stroke="#3d6179"/><text x="1174" y="194" fill="#bdeeff">Web</text>
      <rect x="1228" y="172" width="106" height="34" rx="11" fill="#0d2234" stroke="#3d6179"/><text x="1281" y="194" fill="#bdeeff">Tauri</text>
    </g>

    <g transform="translate(104 244)">
      <rect width="210" height="180" rx="22" fill="#14283b" stroke="#42647d" stroke-width="2"/>
      <text x="105" y="38" fill="#eef8ff" font-size="20" font-weight="800" text-anchor="middle">Media Sources</text>
      <rect x="24" y="60" width="162" height="28" rx="9" fill="#0d1f31"/><text x="105" y="79" fill="#a9c4d5" font-size="13" text-anchor="middle">HTTP Range</text>
      <rect x="24" y="98" width="162" height="28" rx="9" fill="#0d1f31"/><text x="105" y="117" fill="#a9c4d5" font-size="13" text-anchor="middle">OPFS</text>
      <rect x="24" y="136" width="162" height="28" rx="9" fill="#0d1f31"/><text x="105" y="155" fill="#a9c4d5" font-size="13" text-anchor="middle">Tauri starcut://</text>
    </g>

    <path d="M322 334H354" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="338" y="318" fill="#ffcc86" font-size="12" text-anchor="middle">压缩字节</text>

    <g transform="translate(364 244)">
      <rect width="204" height="180" rx="22" fill="#14283b" stroke="#42647d" stroke-width="2"/>
      <text x="102" y="40" fill="#eef8ff" font-size="20" font-weight="800" text-anchor="middle">SCIX + Range</text>
      <text x="102" y="78" fill="#a9c4d5" font-size="14" text-anchor="middle">时间 → sample</text>
      <text x="102" y="108" fill="#a9c4d5" font-size="14" text-anchor="middle">sample → GOP</text>
      <text x="102" y="138" fill="#a9c4d5" font-size="14" text-anchor="middle">GOP → byte range</text>
      <rect x="26" y="154" width="152" height="18" rx="7" fill="#0d1f31"/>
    </g>

    <path d="M576 334H608" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(618 232)">
      <rect width="228" height="204" rx="24" fill="#143a54" stroke="#69d8ff" stroke-width="2" filter="url(#glow)"/>
      <text x="114" y="42" fill="#eef8ff" font-size="21" font-weight="800" text-anchor="middle">Video Worker</text>
      <text x="114" y="82" fill="#bdeeff" font-size="15" text-anchor="middle">Temporal Demand</text>
      <path d="M48 101H180" stroke="#3f7188" stroke-width="2"/>
      <text x="114" y="126" fill="#bdeeff" font-size="15" text-anchor="middle">GOP Flight</text>
      <text x="114" y="158" fill="#9dcbe0" font-size="14" text-anchor="middle">Plan · Reconcile · Budget</text>
      <rect x="30" y="176" width="168" height="20" rx="8" fill="#0b263a"/><text x="114" y="191" fill="#75e1ad" font-size="12" font-weight="700" text-anchor="middle">解码与调度不占主线程</text>
    </g>

    <path d="M854 334H886" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(896 244)">
      <rect width="190" height="180" rx="22" fill="#143a54" stroke="#69d8ff" stroke-width="2"/>
      <text x="95" y="42" fill="#eef8ff" font-size="20" font-weight="800" text-anchor="middle">WebCodecs</text>
      <text x="95" y="82" fill="#bdeeff" font-size="15" text-anchor="middle">EncodedVideoChunk</text>
      <path d="M44 102H146" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="95" y="132" fill="#75e1ad" font-size="15" font-weight="700" text-anchor="middle">Hardware Decode</text>
      <text x="95" y="160" fill="#9dcbe0" font-size="13" text-anchor="middle">sample-level control</text>
    </g>

    <path d="M1094 334H1126" stroke="#75e1ad" stroke-width="3" marker-end="url(#greenArrow)"/>

    <g transform="translate(1136 232)">
      <rect width="200" height="204" rx="24" fill="#143a35" stroke="#75e1ad" stroke-width="2" filter="url(#glow)"/>
      <text x="100" y="42" fill="#eafff4" font-size="21" font-weight="800" text-anchor="middle">VideoFrame</text>
      <text x="100" y="80" fill="#b9e8ce" font-size="14" text-anchor="middle">FrameCache</text>
      <text x="100" y="110" fill="#b9e8ce" font-size="14" text-anchor="middle">Thumbnail Grid</text>
      <text x="100" y="140" fill="#b9e8ce" font-size="14" text-anchor="middle">FrameSet Presenter</text>
      <rect x="24" y="162" width="152" height="28" rx="9" fill="#0d2c29"/><text x="100" y="181" fill="#75e1ad" font-size="13" font-weight="700" text-anchor="middle">OffscreenCanvas / GPU</text>
    </g>

    <g transform="translate(264 496)">
      <rect width="214" height="92" rx="18" fill="#0f2235" stroke="#385a73"/>
      <text x="107" y="36" fill="#eef8ff" font-size="18" font-weight="800" text-anchor="middle">Editor UI</text>
      <text x="107" y="66" fill="#9db8ca" font-size="13" text-anchor="middle">Playhead · Seek · Viewport</text>
    </g>
    <path d="M486 542H526" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(536 496)">
      <rect width="196" height="92" rx="18" fill="#12344a" stroke="#69d8ff"/>
      <text x="98" y="36" fill="#eef8ff" font-size="18" font-weight="800" text-anchor="middle">Control SAB</text>
      <text x="98" y="66" fill="#9dcbe0" font-size="13" text-anchor="middle">publish latest state</text>
    </g>
    <path d="M732 520V462H732V446" fill="none" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="765" y="477" fill="#8facbf" font-size="12">不排队</text>
  </g>

  <g transform="translate(70 682)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect width="410" height="78" rx="18" fill="#11263a" stroke="#2f5068"/><text x="205" y="29" fill="#8facbf" font-size="13">平台边界</text><text x="205" y="56" fill="#eef8ff" font-size="17" font-weight="800">Web / Tauri · 共享一套运行时</text>
    <rect x="445" width="410" height="78" rx="18" fill="#11263a" stroke="#2f5068"/><text x="650" y="29" fill="#8facbf" font-size="13">数据边界</text><text x="650" y="56" fill="#eef8ff" font-size="17" font-weight="800">只移动压缩字节 · 完整像素留在 GPU</text>
    <rect x="890" width="410" height="78" rx="18" fill="#11263a" stroke="#2f5068"/><text x="1095" y="29" fill="#8facbf" font-size="13">控制边界</text><text x="1095" y="56" fill="#eef8ff" font-size="17" font-weight="800">sample · queue · VideoFrame 归编辑器</text>
  </g>
</svg>
