<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">如何同时做到硬件加速与零拷贝</title>
  <desc id="desc">Web 与 Tauri 只提供压缩媒体来源，Video Worker 通过 WebCodecs 使用硬件解码，输出的 VideoFrame 直接进入帧缓存与 OffscreenCanvas GPU 合成。主线程只传递轻量控制状态，不搬运完整像素。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1e31"/></linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12344c"/><stop offset="1" stop-color="#16455a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d8ff"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#75e1ad"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="70" y="72" fill="#eef8ff" font-size="34" font-weight="800" font-family="system-ui, sans-serif">如何同时做到硬件加速与零拷贝</text>
  <text x="70" y="112" fill="#8facbf" font-size="19" font-family="system-ui, sans-serif">重计算交给视频硬件；解码后的完整像素不离开 VideoFrame 与 GPU 主链路。</text>

  <g font-family="system-ui, sans-serif">
    <rect x="70" y="150" width="1300" height="486" rx="30" fill="#10273a" stroke="#3c6b83" stroke-width="2"/>

    <g transform="translate(112 226)">
      <rect width="278" height="250" rx="24" fill="#14283b" stroke="#42647d" stroke-width="2"/>
      <text x="139" y="42" fill="#eef8ff" font-size="21" font-weight="800" text-anchor="middle">Media Sources</text>
      <rect x="28" y="70" width="222" height="62" rx="14" fill="#0d1f31"/>
      <text x="139" y="96" fill="#bdeeff" font-size="16" font-weight="700" text-anchor="middle">Web</text>
      <text x="139" y="119" fill="#8facbf" font-size="13" text-anchor="middle">HTTP Range · OPFS</text>
      <rect x="28" y="150" width="222" height="62" rx="14" fill="#0d1f31"/>
      <text x="139" y="176" fill="#bdeeff" font-size="16" font-weight="700" text-anchor="middle">Tauri</text>
      <text x="139" y="199" fill="#8facbf" font-size="13" text-anchor="middle">Local file protocol</text>
    </g>

    <path d="M402 350H492" stroke="#69d8ff" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="447" y="330" fill="#ffcc86" font-size="14" font-weight="700" text-anchor="middle">压缩样本</text>

    <g transform="translate(508 204)">
      <rect width="386" height="294" rx="28" fill="url(#worker)" stroke="#69d8ff" stroke-width="3" filter="url(#glow)"/>
      <text x="193" y="46" fill="#eef8ff" font-size="23" font-weight="800" text-anchor="middle">Video Worker</text>
      <text x="193" y="79" fill="#9dcbe0" font-size="14" text-anchor="middle">媒体读取 · 解码队列 · 画面呈现</text>
      <rect x="46" y="108" width="294" height="112" rx="20" fill="#0b263a" stroke="#3e7089"/>
      <text x="193" y="146" fill="#eef8ff" font-size="24" font-weight="800" text-anchor="middle">WebCodecs</text>
      <text x="193" y="181" fill="#75e1ad" font-size="18" font-weight="800" text-anchor="middle">Hardware Decode</text>
      <text x="193" y="205" fill="#9dcbe0" font-size="13" text-anchor="middle">系统视频解码器 / GPU surface</text>
      <rect x="70" y="244" width="246" height="30" rx="10" fill="#0d2c29"/>
      <text x="193" y="264" fill="#75e1ad" font-size="14" font-weight="700" text-anchor="middle">输出 VideoFrame，不输出中间 RGBA</text>
    </g>

    <path d="M906 350H1000" stroke="#75e1ad" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="953" y="330" fill="#75e1ad" font-size="14" font-weight="700" text-anchor="middle">VideoFrame</text>

    <g transform="translate(1016 226)">
      <rect width="300" height="250" rx="24" fill="#143a35" stroke="#75e1ad" stroke-width="2"/>
      <text x="150" y="42" fill="#eafff4" font-size="21" font-weight="800" text-anchor="middle">GPU Pipeline</text>
      <text x="150" y="91" fill="#b9e8ce" font-size="16" text-anchor="middle">Frame Cache</text>
      <path d="M86 112H214" stroke="#3c7663" stroke-width="2"/>
      <text x="150" y="143" fill="#b9e8ce" font-size="16" text-anchor="middle">OffscreenCanvas</text>
      <path d="M86 164H214" stroke="#3c7663" stroke-width="2"/>
      <text x="150" y="195" fill="#b9e8ce" font-size="16" text-anchor="middle">Canvas / GPU 合成</text>
      <text x="150" y="225" fill="#75e1ad" font-size="13" font-weight="700" text-anchor="middle">完整像素不跨 IPC / 主线程</text>
    </g>

    <g transform="translate(300 536)">
      <rect width="322" height="64" rx="18" fill="#0f2235" stroke="#385a73"/>
      <text x="161" y="28" fill="#eef8ff" font-size="17" font-weight="800" text-anchor="middle">Editor UI · Main Thread</text>
      <text x="161" y="50" fill="#9db8ca" font-size="12" text-anchor="middle">只发布位置、尺寸与工程变化</text>
    </g>
    <path d="M630 568H782V510" fill="none" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="704" y="553" fill="#8facbf" font-size="12" text-anchor="middle">轻量控制状态</text>
  </g>

  <g transform="translate(70 676)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect width="630" height="82" rx="20" fill="#11263a" stroke="#2f5068"/>
    <text x="315" y="30" fill="#8facbf" font-size="14">硬件加速</text>
    <text x="315" y="59" fill="#eef8ff" font-size="19" font-weight="800">WebCodecs 把像素重计算交给系统视频硬件</text>
    <rect x="670" width="630" height="82" rx="20" fill="#112b30" stroke="#356555"/>
    <text x="985" y="30" fill="#8fb9a5" font-size="14">零拷贝</text>
    <text x="985" y="59" fill="#eafff4" font-size="19" font-weight="800">VideoFrame 直接进入 GPU 合成，不绕回 CPU</text>
  </g>
</svg>
