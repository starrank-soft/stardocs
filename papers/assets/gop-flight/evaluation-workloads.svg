<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">视频解码调度的两项核心考验</title>
  <desc id="desc">左侧是高速往返后停留的 Scrub，右侧是时间线 Zoom 和 Scroll 导致的缩略图网格变化，底部列出反馈、精确性、工作放大、饥饿与资源峰值指标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1d30"/></linearGradient>
    <linearGradient id="motion" x1="0" x2="1"><stop stop-color="#69d8ff"/><stop offset="1" stop-color="#b7a1ff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d8ff"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="72" y="78" fill="#eaf6ff" font-size="34" font-weight="700" font-family="system-ui, sans-serif">两项核心考题：Scrub 与 Timeline Zoom / Scroll</text>
  <text x="72" y="120" fill="#8facbf" font-size="20" font-family="system-ui, sans-serif">Play 与单次 Seek 验证基础正确性；连续移动和全局换站才会暴露调度质量。</text>

  <rect x="70" y="172" width="630" height="426" rx="26" fill="#0f2033" stroke="#294a63"/>
  <text x="108" y="220" fill="#eaf6ff" font-size="25" font-weight="800" font-family="system-ui, sans-serif">考题 A · 高速往返 Scrub</text>
  <text x="108" y="252" fill="#8facbf" font-size="16" font-family="system-ui, sans-serif">连续向前 → 快速反向 → 停留 80ms</text>
  <line x1="120" y1="352" x2="642" y2="352" stroke="#385d78" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 318C300 250 520 255 610 318" fill="none" stroke="url(#motion)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M590 386C430 452 250 445 182 386" fill="none" stroke="#ffb454" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#b7a1ff"><circle cx="200" cy="352" r="8"/><circle cx="270" cy="352" r="8"/><circle cx="340" cy="352" r="8"/><circle cx="410" cy="352" r="8"/><circle cx="480" cy="352" r="8"/><circle cx="550" cy="352" r="8"/></g>
  <g transform="translate(182 352)" font-family="system-ui, sans-serif" text-anchor="middle"><circle r="30" fill="#7ce0ae" filter="url(#glow)"/><path d="M-7-10V10M7-10V10" stroke="#073222" stroke-width="6"/><text y="62" fill="#b7f1d1" font-size="15">最终精确帧</text></g>
  <g font-family="system-ui, sans-serif">
    <rect x="108" y="478" width="170" height="82" rx="15" fill="#102b42"/><text x="193" y="509" fill="#dff6ff" font-size="17" font-weight="700" text-anchor="middle">移动反馈</text><text x="193" y="537" fill="#8facbf" font-size="14" text-anchor="middle">输入后多久有画面</text>
    <rect x="300" y="478" width="170" height="82" rx="15" fill="#102b42"/><text x="385" y="509" fill="#dff6ff" font-size="17" font-weight="700" text-anchor="middle">反向复用</text><text x="385" y="537" fill="#8facbf" font-size="14" text-anchor="middle">是否出现 reset 风暴</text>
    <rect x="492" y="478" width="170" height="82" rx="15" fill="#102b42"/><text x="577" y="509" fill="#dff6ff" font-size="17" font-weight="700" text-anchor="middle">停留收敛</text><text x="577" y="537" fill="#8facbf" font-size="14" text-anchor="middle">最终是否准确</text>
  </g>

  <rect x="740" y="172" width="630" height="426" rx="26" fill="#0f2033" stroke="#294a63"/>
  <text x="778" y="220" fill="#eaf6ff" font-size="25" font-weight="800" font-family="system-ui, sans-serif">考题 B · Timeline Zoom / Scroll</text>
  <text x="778" y="252" fill="#8facbf" font-size="16" font-family="system-ui, sans-serif">视口变化 → 刻度变化 → 网格目标大面积换站</text>
  <g font-family="system-ui, sans-serif">
    <text x="790" y="306" fill="#8facbf" font-size="15">Before</text>
    <rect x="860" y="278" width="454" height="58" rx="12" fill="#0a1725" stroke="#31536d"/>
    <g fill="#7ce0ae"><circle cx="904" cy="307" r="8"/><circle cx="980" cy="307" r="8"/><circle cx="1056" cy="307" r="8"/><circle cx="1132" cy="307" r="8"/><circle cx="1208" cy="307" r="8"/><circle cx="1284" cy="307" r="8"/></g>
    <path d="M1087 344V378" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="790" y="430" fill="#8facbf" font-size="15">After</text>
    <rect x="860" y="402" width="454" height="58" rx="12" fill="#12304a" stroke="#69d8ff" stroke-width="2"/>
    <g fill="#b7a1ff"><circle cx="882" cy="431" r="7"/><circle cx="926" cy="431" r="7"/><circle cx="970" cy="431" r="7"/><circle cx="1014" cy="431" r="7"/><circle cx="1058" cy="431" r="7"/><circle cx="1102" cy="431" r="7"/><circle cx="1146" cy="431" r="7"/><circle cx="1190" cy="431" r="7"/><circle cx="1234" cy="431" r="7"/><circle cx="1278" cy="431" r="7"/></g>
    <rect x="778" y="490" width="170" height="70" rx="15" fill="#102b42"/><text x="863" y="518" fill="#dff6ff" font-size="17" font-weight="700" text-anchor="middle">首屏覆盖</text><text x="863" y="543" fill="#8facbf" font-size="14" text-anchor="middle">多久看见完整网格</text>
    <rect x="970" y="490" width="170" height="70" rx="15" fill="#102b42"/><text x="1055" y="518" fill="#dff6ff" font-size="17" font-weight="700" text-anchor="middle">增量换站</text><text x="1055" y="543" fill="#8facbf" font-size="14" text-anchor="middle">旧目标是否及时离场</text>
    <rect x="1162" y="490" width="170" height="70" rx="15" fill="#102b42"/><text x="1247" y="518" fill="#dff6ff" font-size="17" font-weight="700" text-anchor="middle">前台影响</text><text x="1247" y="543" fill="#8facbf" font-size="14" text-anchor="middle">当前画面饿多久</text>
  </g>

  <rect x="70" y="638" width="1300" height="126" rx="22" fill="#10243a" stroke="#294a63"/>
  <text x="720" y="675" fill="#8facbf" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif">两类工作负载使用同一组账本</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle" font-size="17" font-weight="700"><text x="220" y="720" fill="#69d8ff">交互反馈</text><text x="465" y="720" fill="#7ce0ae">精确收敛</text><text x="720" y="720" fill="#ffb454">工作放大</text><text x="975" y="720" fill="#b7a1ff">来源饥饿</text><text x="1220" y="720" fill="#e07979">资源峰值</text></g>
  <g fill="#365267"><circle cx="340" cy="714" r="4"/><circle cx="592" cy="714" r="4"/><circle cx="848" cy="714" r="4"/><circle cx="1098" cy="714" r="4"/></g>
  <text x="720" y="792" fill="#7898ad" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif">Pilot traces 只说明方向；正式结论需要冻结设备、浏览器、素材 GOP、手势轨迹与重复次数</text>
</svg>
