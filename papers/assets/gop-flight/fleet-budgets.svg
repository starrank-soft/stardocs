<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">GOP Flight 车队与资源预算</title>
  <desc id="desc">六个驻留解码器中通常只运行两条后台路线，当前画面缺失时前台可扩展到全部；五种资源分别限流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1d30"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d8ff"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="72" y="78" fill="#eaf6ff" font-size="34" font-weight="700" font-family="system-ui, sans-serif">有限车队，分级通行，分别计算每种资源</text>
  <text x="72" y="120" fill="#8facbf" font-size="20" font-family="system-ui, sans-serif">驻留解码器不等于同时满速运行；前台画面优先使用可用能力。</text>

  <rect x="70" y="174" width="780" height="466" rx="24" fill="#0f2033" stroke="#294a63"/>
  <text x="106" y="218" fill="#eaf6ff" font-size="23" font-weight="700" font-family="system-ui, sans-serif">当前车队：最多 6 个驻留 Decoder</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(116 262)"><rect width="210" height="124" rx="18" fill="#123b55" stroke="#69d8ff" stroke-width="2" filter="url(#glow)"/><text x="105" y="42" fill="#eaf9ff" font-size="19" font-weight="700">前台 Flight 1</text><text x="105" y="74" fill="#9dcbe0" font-size="15">当前合成层</text><rect x="30" y="91" width="150" height="8" rx="4" fill="#69d8ff"/></g>
    <g transform="translate(352 262)"><rect width="210" height="124" rx="18" fill="#123b55" stroke="#69d8ff" stroke-width="2" filter="url(#glow)"/><text x="105" y="42" fill="#eaf9ff" font-size="19" font-weight="700">前台 Flight 2</text><text x="105" y="74" fill="#9dcbe0" font-size="15">当前合成层</text><rect x="30" y="91" width="150" height="8" rx="4" fill="#69d8ff"/></g>
    <g transform="translate(588 262)"><rect width="210" height="124" rx="18" fill="#17334b" stroke="#3e6077"/><text x="105" y="42" fill="#dff6ff" font-size="19" font-weight="700">温热 Route 3</text><text x="105" y="74" fill="#8facbf" font-size="15">可快速续跑</text><rect x="30" y="91" width="150" height="8" rx="4" fill="#38566d"/></g>
    <g transform="translate(116 420)"><rect width="210" height="124" rx="18" fill="#17334b" stroke="#3e6077"/><text x="105" y="42" fill="#dff6ff" font-size="19" font-weight="700">温热 Route 4</text><text x="105" y="74" fill="#8facbf" font-size="15">保留有价值前缀</text><rect x="30" y="91" width="150" height="8" rx="4" fill="#38566d"/></g>
    <g transform="translate(352 420)"><rect width="210" height="124" rx="18" fill="#17334b" stroke="#3e6077"/><text x="105" y="42" fill="#dff6ff" font-size="19" font-weight="700">温热 Route 5</text><text x="105" y="74" fill="#8facbf" font-size="15">等待前台需求</text><rect x="30" y="91" width="150" height="8" rx="4" fill="#38566d"/></g>
    <g transform="translate(588 420)"><rect width="210" height="124" rx="18" fill="#17334b" stroke="#3e6077"/><text x="105" y="42" fill="#dff6ff" font-size="19" font-weight="700">温热 Route 6</text><text x="105" y="74" fill="#8facbf" font-size="15">空闲后冷却</text><rect x="30" y="91" width="150" height="8" rx="4" fill="#38566d"/></g>
  </g>
  <rect x="116" y="578" width="682" height="36" rx="10" fill="#132d42"/><text x="457" y="602" fill="#a9c4d5" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif">通常仅 2 条后台 Flight 活跃；当前画面缺失时可动用整个车队</text>

  <path d="M850 404H912" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="920" y="174" width="450" height="466" rx="24" fill="#0f2033" stroke="#294a63"/>
  <text x="1145" y="218" fill="#eaf6ff" font-size="23" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">五本独立账簿</text>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(968 254)"><circle cx="24" cy="24" r="20" fill="#69d8ff"/><text x="60" y="20" fill="#dff6ff" font-size="18" font-weight="700">Decoder 驻留</text><text x="60" y="44" fill="#8facbf" font-size="14">硬件与参考状态</text></g>
    <g transform="translate(968 326)"><circle cx="24" cy="24" r="20" fill="#b7a1ff"/><text x="60" y="20" fill="#dff6ff" font-size="18" font-weight="700">活跃 Flight</text><text x="60" y="44" fill="#8facbf" font-size="14">同时推进的路线</text></g>
    <g transform="translate(968 398)"><circle cx="24" cy="24" r="20" fill="#ffb454"/><text x="60" y="20" fill="#dff6ff" font-size="18" font-weight="700">Range I/O</text><text x="60" y="44" fill="#8facbf" font-size="14">连接与压缩字节</text></g>
    <g transform="translate(968 470)"><circle cx="24" cy="24" r="20" fill="#7ce0ae"/><text x="60" y="20" fill="#dff6ff" font-size="18" font-weight="700">解码帧</text><text x="60" y="44" fill="#8facbf" font-size="14">CPU / GPU 内存</text></g>
    <g transform="translate(968 542)"><circle cx="24" cy="24" r="20" fill="#e07979"/><text x="60" y="20" fill="#dff6ff" font-size="18" font-weight="700">推测目标</text><text x="60" y="44" fill="#8facbf" font-size="14">预测工作放大</text></g>
  </g>
  <g transform="translate(116 690)" font-family="system-ui, sans-serif" text-anchor="middle"><rect width="1208" height="70" rx="18" fill="#10243a" stroke="#294a63"/><text x="604" y="30" fill="#8facbf" font-size="15">通行顺序</text><text x="604" y="56" fill="#eaf6ff" font-size="19" font-weight="700">当前 FrameSet → 播放前方 → Scrub 预测 → 缩略图网格</text></g>
</svg>
