<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">GOP Flight 核心运行模型</title>
  <desc id="desc">当前时序需求经过纯规划器生成目标路线，运行协调器将目标路线与现有 Flight 匹配。物理 Flight 保存压缩字节、解码状态、在途输出与目标站点，使需求可替换而已经付出的工作能够复用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1e31"/></linearGradient>
    <linearGradient id="flight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#123b55"/><stop offset="1" stop-color="#153c4b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d8ff"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="810" fill="url(#bg)"/>
  <text x="70" y="72" fill="#eef8ff" font-size="34" font-weight="800" font-family="system-ui, sans-serif">GOP Flight：计划可以替换，物理路线持续复用</text>
  <text x="70" y="112" fill="#8facbf" font-size="19" font-family="system-ui, sans-serif">把“现在想看什么”与“已经为它付出了什么”分开，交互变化不再等于重新解码。</text>

  <g font-family="system-ui, sans-serif">
    <g transform="translate(70 158)">
      <rect width="276" height="190" rx="23" fill="#14283b" stroke="#3e6079" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#69d8ff"/><text x="36" y="45" text-anchor="middle" fill="#062238" font-size="18" font-weight="800">1</text>
      <text x="68" y="46" fill="#eef8ff" font-size="21" font-weight="800">时序需求快照</text>
      <text x="28" y="88" fill="#bdeeff" font-size="16">此刻真正需要哪些画面</text>
      <g fill="#0d1f31" stroke="#2f5068"><rect x="28" y="112" width="54" height="34" rx="9"/><rect x="92" y="112" width="66" height="34" rx="9"/><rect x="168" y="112" width="54" height="34" rx="9"/><rect x="232" y="112" width="28" height="34" rx="9"/></g>
      <g fill="#9edff6" font-size="13" text-anchor="middle"><text x="55" y="134">point</text><text x="125" y="134">stream</text><text x="195" y="134">range</text><text x="246" y="134">grid</text></g>
      <text x="28" y="174" fill="#8facbf" font-size="14">新快照替换旧意图</text>
    </g>

    <path d="M354 253H390" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(400 158)">
      <rect width="276" height="190" rx="23" fill="#14283b" stroke="#3e6079" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#69d8ff"/><text x="36" y="45" text-anchor="middle" fill="#062238" font-size="18" font-weight="800">2</text>
      <text x="68" y="46" fill="#eef8ff" font-size="21" font-weight="800">纯规划器</text>
      <text x="28" y="88" fill="#bdeeff" font-size="16">把意图变成物理解码路线</text>
      <text x="28" y="122" fill="#a9c4d5" font-size="14">工程时间 → 源媒体时间</text>
      <text x="28" y="148" fill="#a9c4d5" font-size="14">目标 → 真实样本 → GOP 分组</text>
      <text x="28" y="174" fill="#8facbf" font-size="14">只计算，不持有解码器</text>
    </g>

    <path d="M684 253H720" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(730 158)">
      <rect width="276" height="190" rx="23" fill="#14344a" stroke="#69d8ff" stroke-width="2" filter="url(#glow)"/>
      <circle cx="36" cy="38" r="18" fill="#75e1ad"/><text x="36" y="45" text-anchor="middle" fill="#073222" font-size="18" font-weight="800">3</text>
      <text x="68" y="46" fill="#eef8ff" font-size="21" font-weight="800">运行协调器</text>
      <text x="28" y="88" fill="#bdeeff" font-size="16">新路线与在途工作对账</text>
      <text x="28" y="122" fill="#a9c4d5" font-size="14">继续 · 改站 · 等待 · 退让</text>
      <text x="28" y="148" fill="#a9c4d5" font-size="14">只在必要时破坏物理状态</text>
      <text x="28" y="174" fill="#75e1ad" font-size="14" font-weight="700">需求变了，不等于全部重启</text>
    </g>

    <path d="M1014 253H1050" stroke="#69d8ff" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(1060 158)">
      <rect width="310" height="190" rx="23" fill="#153c4b" stroke="#75e1ad" stroke-width="2"/>
      <circle cx="36" cy="38" r="18" fill="#75e1ad"/><text x="36" y="45" text-anchor="middle" fill="#073222" font-size="18" font-weight="800">4</text>
      <text x="68" y="46" fill="#eef8ff" font-size="21" font-weight="800">物理 Flight</text>
      <text x="28" y="88" fill="#c9f5dc" font-size="16">保存已经付出的路线成本</text>
      <text x="28" y="122" fill="#b4d9c5" font-size="14">压缩 GOP · 解码器参考状态</text>
      <text x="28" y="148" fill="#b4d9c5" font-size="14">推进位置 · 在途输出 · 目标站</text>
      <text x="28" y="174" fill="#75e1ad" font-size="14" font-weight="700">多个需求共乘一趟路线</text>
    </g>
  </g>

  <g transform="translate(70 408)" font-family="system-ui, sans-serif">
    <rect width="1300" height="206" rx="28" fill="url(#flight)" stroke="#396d82" stroke-width="2"/>
    <text x="34" y="42" fill="#eef8ff" font-size="21" font-weight="800">一趟正在行驶的 Flight，拥有三层覆盖状态</text>
    <text x="34" y="70" fill="#9dcbe0" font-size="14">规划器必须看见“已经交付、正在兑现、可以继续”三种事实，才能避免重复发车。</text>

    <path d="M86 132H1210" stroke="#69d8ff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g text-anchor="middle">
      <circle cx="210" cy="132" r="18" fill="#75e1ad"/><text x="210" y="138" fill="#073222" font-size="15" font-weight="800">A</text>
      <text x="210" y="178" fill="#c9f5dc" font-size="15" font-weight="700">已物化</text><text x="210" y="198" fill="#9dc4b0" font-size="13">FrameCache</text>
      <circle cx="570" cy="132" r="18" fill="#ffcc86"/><text x="570" y="138" fill="#4a2a04" font-size="15" font-weight="800">B</text>
      <text x="570" y="178" fill="#ffe0b2" font-size="15" font-weight="700">已提交、在输出路上</text><text x="570" y="198" fill="#c9ad85" font-size="13">pending output</text>
      <circle cx="930" cy="132" r="18" fill="#69d8ff"/><text x="930" y="138" fill="#062238" font-size="15" font-weight="800">C</text>
      <text x="930" y="178" fill="#bdeeff" font-size="15" font-weight="700">路线仍可向前</text><text x="930" y="198" fill="#8facbf" font-size="13">warm checkpoint</text>
    </g>
  </g>

  <g transform="translate(70 650)" font-family="system-ui, sans-serif" text-anchor="middle">
    <rect width="305" height="92" rx="18" fill="#11263a" stroke="#2f5068"/><text x="152" y="35" fill="#8facbf" font-size="13">需求事实</text><text x="152" y="65" fill="#eef8ff" font-size="17" font-weight="800">只认最新快照</text>
    <rect x="330" width="305" height="92" rx="18" fill="#11263a" stroke="#2f5068"/><text x="482" y="35" fill="#8facbf" font-size="13">路线复用</text><text x="482" y="65" fill="#eef8ff" font-size="17" font-weight="800">公共 GOP 前缀只解一次</text>
    <rect x="660" width="305" height="92" rx="18" fill="#11263a" stroke="#2f5068"/><text x="812" y="35" fill="#8facbf" font-size="13">交付语义</text><text x="812" y="65" fill="#eef8ff" font-size="17" font-weight="800">在途覆盖不等于完成</text>
    <rect x="990" width="310" height="92" rx="18" fill="#11263a" stroke="#2f5068"/><text x="1145" y="35" fill="#8facbf" font-size="13">资源边界</text><text x="1145" y="65" fill="#eef8ff" font-size="17" font-weight="800">温热复用必须有预算</text>
  </g>
</svg>
