<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">MG 运行时方案演进</title><desc id="d">从 Remotion 与 HyperFrames，经 HTML-in-Canvas 和服务端渲染，最终收敛为单时钟 SVG Component。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="105" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#111827">真正的分界线：浏览器能否直接交出一帧</text>
  <path d="M195 660H1400" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(90 190)"><rect width="330" height="390" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="165" cy="470" r="18" fill="#94a3b8"/><text x="30" y="58" font-size="24" font-weight="800" fill="#111827">Remotion / HyperFrames</text><text x="30" y="103" font-size="20" fill="#64748b">成熟方案，先走这条路</text><rect x="30" y="145" width="270" height="150" rx="16" fill="#eef2ff"/><text x="165" y="210" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">网页按帧运动</text><text x="165" y="246" text-anchor="middle" font-size="18" fill="#7c3aed">Preview 很成熟</text><text x="30" y="345" font-size="20" fill="#475569">DOM 画面可见</text><text x="30" y="378" font-size="20" fill="#475569">但还不是 ImageBitmap</text></g>
    <g transform="translate(450 190)"><rect width="330" height="390" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="165" cy="470" r="18" fill="#f59e0b"/><text x="30" y="58" font-size="27" font-weight="800" fill="#111827">HTML-in-Canvas</text><text x="30" y="103" font-size="20" fill="#64748b">试图接通 DOM 与像素</text><rect x="30" y="145" width="270" height="150" rx="16" fill="#fff7ed"/><rect x="64" y="174" width="202" height="95" rx="10" fill="#fff" stroke="#f59e0b"/><text x="165" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">DOM → Canvas</text><text x="30" y="345" font-size="20" fill="#475569">实验性 Chrome Flag</text><text x="30" y="378" font-size="20" fill="#475569">高频取帧不稳定、会崩溃</text></g>
    <g transform="translate(810 190)"><rect width="330" height="390" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="165" cy="470" r="18" fill="#ef4444"/><text x="30" y="58" font-size="28" font-weight="800" fill="#111827">Chromium / MP4</text><text x="30" y="103" font-size="20" fill="#64748b">离线逐帧，再生成视频</text><rect x="30" y="145" width="270" height="150" rx="16" fill="#fef2f2"/><text x="165" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#b91c1c">第二运行时</text><path d="M95 247H235" stroke="#ef4444" stroke-width="8"/><path d="M215 230L240 247 215 264" fill="none" stroke="#ef4444" stroke-width="6"/><text x="30" y="345" font-size="20" fill="#475569">预览与导出分叉</text><text x="30" y="378" font-size="20" fill="#475569">修改、透明度代价上升</text></g>
    <g transform="translate(1170 170)"><rect width="340" height="430" rx="28" fill="#111827" stroke="#7c3aed" stroke-width="4"/><circle cx="170" cy="490" r="22" fill="#7c3aed"/><text x="32" y="68" font-size="28" font-weight="800" fill="#fff">SVG Component</text><text x="32" y="112" font-size="20" fill="#a5b4fc">一个时钟，一份动画实现</text><rect x="32" y="155" width="276" height="166" rx="18" fill="#1e293b"/><text x="170" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="23" fill="#67e8f9">render(time)</text><text x="170" y="258" text-anchor="middle" font-size="19" fill="#e2e8f0">Live SVG · ImageBitmap</text><text x="32" y="373" font-size="20" fill="#cbd5e1">预览保持矢量</text><text x="32" y="408" font-size="20" fill="#cbd5e1">像素消费者按需栅格化</text></g>
  </g>
  <text x="90" y="790" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#475569">不是成熟方案不会做动画，而是浏览器编辑器还需要一条稳定、直接的 Bitmap 出口。</text>
</svg>
