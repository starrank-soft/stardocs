<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">MG 运行时方案演进</title><desc id="d">Remotion 与 HyperFrames 的可靠像素输出需要服务端 Chromium，而一期主要是平面动画，最终收敛为浏览器内 SVG Component。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="105" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#111827">浏览器预览不难，难的是不用服务器拿到像素</text>
  <path d="M195 660H1400" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(90 190)"><rect width="330" height="390" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="165" cy="470" r="18" fill="#94a3b8"/><text x="30" y="58" font-size="24" font-weight="800" fill="#111827">Remotion / HyperFrames</text><text x="30" y="103" font-size="20" fill="#64748b">成熟方案，先走这条路</text><rect x="30" y="145" width="270" height="150" rx="16" fill="#eef2ff"/><text x="165" y="210" text-anchor="middle" font-size="23" font-weight="700" fill="#6d28d9">网页按帧运动</text><text x="165" y="246" text-anchor="middle" font-size="18" fill="#7c3aed">Preview 很成熟</text><text x="30" y="345" font-size="20" fill="#475569">DOM 画面可见</text><text x="30" y="378" font-size="20" fill="#475569">但还不是 ImageBitmap</text></g>
    <g transform="translate(450 190)"><rect width="330" height="390" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="165" cy="470" r="18" fill="#f59e0b"/><text x="30" y="58" font-size="27" font-weight="800" fill="#111827">Chromium Server</text><text x="30" y="103" font-size="20" fill="#64748b">网页逐帧 Capture</text><rect x="30" y="145" width="270" height="150" rx="16" fill="#fff7ed"/><rect x="64" y="174" width="202" height="95" rx="10" fill="#fff" stroke="#f59e0b"/><text x="165" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Chrome → FFmpeg</text><text x="165" y="251" text-anchor="middle" font-size="17" fill="#c2410c">PNG / MP4</text><text x="30" y="345" font-size="20" fill="#475569">CPU · 内存 · 并发队列</text><text x="30" y="378" font-size="20" fill="#475569">每次修改都可能重新渲染</text></g>
    <g transform="translate(810 190)"><rect width="330" height="390" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="165" cy="470" r="18" fill="#ef4444"/><text x="30" y="58" font-size="28" font-weight="800" fill="#111827">表达能力的 ROI</text><text x="30" y="103" font-size="20" fill="#64748b">复杂能力使用频率很低</text><rect x="30" y="145" width="270" height="150" rx="16" fill="#fef2f2"/><text x="165" y="207" text-anchor="middle" font-size="23" font-weight="700" fill="#b91c1c">Particles / WebGL / 3D</text><path d="M95 247H235" stroke="#ef4444" stroke-width="8"/><path d="M215 230L240 247 215 264" fill="none" stroke="#ef4444" stroke-width="6"/><text x="30" y="345" font-size="20" fill="#475569">大部分 MG 是平面动画</text><text x="30" y="378" font-size="20" fill="#475569">一期不值得承担重链路</text></g>
    <g transform="translate(1170 170)"><rect width="340" height="430" rx="28" fill="#111827" stroke="#7c3aed" stroke-width="4"/><circle cx="170" cy="490" r="22" fill="#7c3aed"/><text x="32" y="68" font-size="28" font-weight="800" fill="#fff">SVG Component</text><text x="32" y="112" font-size="20" fill="#a5b4fc">一个时钟，一份动画实现</text><rect x="32" y="155" width="276" height="166" rx="18" fill="#1e293b"/><text x="170" y="213" text-anchor="middle" font-family="ui-monospace,monospace" font-size="23" fill="#67e8f9">render(time)</text><text x="170" y="258" text-anchor="middle" font-size="19" fill="#e2e8f0">Live SVG · ImageBitmap</text><text x="32" y="373" font-size="20" fill="#cbd5e1">预览保持矢量</text><text x="32" y="408" font-size="20" fill="#cbd5e1">像素消费者按需栅格化</text></g>
  </g>
  <text x="90" y="790" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#475569">不要让少量粒子与 3D 场景，决定一期平面 Motion Graphics 的主架构。</text>
</svg>
