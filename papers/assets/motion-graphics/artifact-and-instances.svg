<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">稳定 MG Artifact 与多个 Clip 实例</title><desc id="d">一份 MG 源以稳定 Artifact ID 被多个 Clip 引用，每个 Clip 保存自己的参数和呈现。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="105" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#111827">源负责设计，Clip 负责这一次使用</text>
  <g transform="translate(90 180)" font-family="system-ui,sans-serif">
    <rect width="470" height="560" rx="30" fill="#111827"/>
    <text x="38" y="62" font-size="26" font-weight="800" fill="#fff">Stable Artifact ID</text>
    <text x="38" y="99" font-family="ui-monospace,monospace" font-size="18" fill="#a5b4fc">assets/lower-third.mg</text>
    <rect x="38" y="140" width="394" height="120" rx="18" fill="#1e293b"/><text x="62" y="185" font-size="20" fill="#94a3b8">current revision</text><text x="62" y="225" font-family="ui-monospace,monospace" font-size="21" font-weight="800" fill="#67e8f9">hash: 8a4f…</text>
    <text x="38" y="325" font-size="22" font-weight="700" fill="#c4b5fd">源拥有</text>
    <text x="38" y="368" font-size="20" fill="#cbd5e1">SVG 场景 · 内部运动 · 默认值</text>
    <text x="38" y="405" font-size="20" fill="#cbd5e1">变量模式 · 字体 · 时长</text>
    <path d="M38 455H432" stroke="#334155"/>
    <text x="38" y="505" font-size="19" fill="#94a3b8">修改源 → 新 Blob Hash</text><text x="38" y="537" font-size="19" fill="#94a3b8">Artifact ID 与 Clip 引用不变</text>
  </g>
  <g stroke="#7c3aed" stroke-width="5" fill="none"><path d="M560 340H730"/><path d="M650 340V230H730"/><path d="M650 340V450H730"/><path d="M650 340V670H730"/></g>
  <g transform="translate(760 165)" font-family="system-ui,sans-serif">
    <g><rect width="750" height="170" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><text x="32" y="51" font-size="25" font-weight="800" fill="#111827">Clip A · 开场</text><text x="32" y="90" font-size="20" fill="#64748b">title = “AI Native Video” · accent = 紫色</text><text x="32" y="128" font-size="20" fill="#64748b">0–5s · 左下角 · 100%</text><rect x="560" y="34" width="150" height="100" rx="16" fill="#ede9fe"/><text x="635" y="93" text-anchor="middle" font-size="22" font-weight="800" fill="#7c3aed">AI Native</text></g>
    <g transform="translate(0 220)"><rect width="750" height="170" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><text x="32" y="51" font-size="25" font-weight="800" fill="#111827">Clip B · 嘉宾介绍</text><text x="32" y="90" font-size="20" fill="#64748b">title = “Yan Bingbing” · accent = 青色</text><text x="32" y="128" font-size="20" fill="#64748b">35–40s · 右下角 · 92%</text><rect x="560" y="34" width="150" height="100" rx="16" fill="#cffafe"/><text x="635" y="93" text-anchor="middle" font-size="22" font-weight="800" fill="#0e7490">Yan Bingbing</text></g>
    <g transform="translate(0 440)"><rect width="750" height="170" rx="26" fill="#fff" stroke="#d7dee8" stroke-width="2"/><text x="32" y="51" font-size="25" font-weight="800" fill="#111827">Clip C · 结尾</text><text x="32" y="90" font-size="20" fill="#64748b">title = “Try StarCut” · accent = 绿色</text><text x="32" y="128" font-size="20" fill="#64748b">88–93s · 居中 · 120%</text><rect x="560" y="34" width="150" height="100" rx="16" fill="#d1fae5"/><text x="635" y="93" text-anchor="middle" font-size="22" font-weight="800" fill="#047857">Try StarCut</text></g>
  </g>
  <text x="90" y="820" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#475569">同一动画被复用三次，没有复制三份源代码；实例参数也没有污染模板设计。</text>
</svg>
