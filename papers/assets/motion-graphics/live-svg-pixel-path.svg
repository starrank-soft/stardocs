<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">MG 的实时矢量与按需像素路径</title><desc id="d">MG 在预览中保持 Live SVG，需要缩略图、抽帧和导出时才栅格化。</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
  <rect width="1600" height="900" fill="#0b1020"/>
  <text x="90" y="105" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#fff">实时保持矢量，需要像素时再转换</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(90 210)"><rect width="330" height="190" rx="28" fill="#171f31" stroke="url(#g)" stroke-width="3"/><text x="165" y="67" text-anchor="middle" font-size="25" fill="#94a3b8">同一份 MG</text><text x="165" y="119" text-anchor="middle" font-family="ui-monospace,monospace" font-size="30" font-weight="800" fill="#67e8f9">render(time)</text><text x="165" y="158" text-anchor="middle" font-size="19" fill="#cbd5e1">Source · Props · Clock</text></g>
    <path d="M420 305H535C585 305 585 230 635 230" fill="none" stroke="#7c3aed" stroke-width="7"/><path d="M420 305H535C585 305 585 580 635 580" fill="none" stroke="#06b6d4" stroke-width="7"/>
    <g transform="translate(650 150)"><rect width="380" height="255" rx="28" fill="#211b3d" stroke="#7c3aed" stroke-width="2"/><text x="34" y="58" font-size="28" font-weight="800" fill="#fff">实时预览</text><text x="34" y="98" font-size="20" fill="#c4b5fd">SVG 继续活在 DOM 中</text><rect x="34" y="132" width="312" height="82" rx="16" fill="#15152a"/><text x="190" y="183" text-anchor="middle" font-size="23" font-weight="700" fill="#ddd6fe">Seek · Visibility · Transform</text></g>
    <g transform="translate(650 475)"><rect width="380" height="255" rx="28" fill="#102934" stroke="#06b6d4" stroke-width="2"/><text x="34" y="58" font-size="28" font-weight="800" fill="#fff">像素消费者</text><text x="34" y="98" font-size="20" fill="#a5f3fc">在准确时刻克隆当前 SVG</text><text x="34" y="151" font-size="20" fill="#e2e8f0">SVG → ImageBitmap → Canvas</text><text x="34" y="197" font-size="20" fill="#94a3b8">缩略图 · 抽帧 · 编码器</text></g>
    <g transform="translate(1120 150)"><text font-size="25" font-weight="800" fill="#a5b4fc">预览表面按轨道交替</text><g transform="translate(0 55)" font-size="22" font-weight="700"><rect width="380" height="100" rx="18" fill="#172033" stroke="#475569"/><text x="190" y="60" text-anchor="middle" fill="#cbd5e1">Canvas · 视频 / 图片 / 文字</text><rect y="120" width="380" height="100" rx="18" fill="#211b3d" stroke="#7c3aed"/><text x="190" y="180" text-anchor="middle" fill="#ddd6fe">HTML · Live SVG MG</text><rect y="240" width="380" height="100" rx="18" fill="#172033" stroke="#475569"/><text x="190" y="300" text-anchor="middle" fill="#cbd5e1">Canvas · 更高视觉轨道</text><rect y="360" width="380" height="100" rx="18" fill="#102934" stroke="#06b6d4"/><text x="190" y="420" text-anchor="middle" fill="#a5f3fc">HTML · 更高 MG</text></g></g>
  </g>
  <text x="90" y="820" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#94a3b8">没有每帧 DOM 截图循环，也没有一套独立的服务端动画解释器。</text>
</svg>
