<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">MG 源文件契约</title><desc id="d">静态元数据、变量、SVG 场景和 render time 组成一份可编辑 MG。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="105" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#111827">一份源文件，两种读取方式</text>
  <g transform="translate(90 170)" font-family="system-ui,sans-serif">
    <rect width="560" height="620" rx="30" fill="#111827"/>
    <circle cx="40" cy="38" r="7" fill="#ef4444"/><circle cx="64" cy="38" r="7" fill="#f59e0b"/><circle cx="88" cy="38" r="7" fill="#10b981"/>
    <text x="130" y="47" font-family="ui-monospace,monospace" font-size="21" fill="#cbd5e1">product-title.mg</text>
    <g transform="translate(36 88)" font-family="ui-monospace,monospace" font-size="20">
      <text y="0" fill="#c4b5fd">export const metadata = {</text>
      <text x="24" y="38" fill="#e2e8f0">width, height, duration,</text>
      <text x="24" y="76" fill="#67e8f9">fonts, variables</text>
      <text y="114" fill="#c4b5fd">};</text>
      <text y="180" fill="#a7f3d0">export default class extends HTMLElement {</text>
      <text x="24" y="224" fill="#e2e8f0">set props(value) { … }</text>
      <text x="24" y="268" fill="#e2e8f0">connectedCallback() {</text>
      <text x="48" y="306" fill="#fde68a">mountOneSvg();</text>
      <text x="24" y="344" fill="#e2e8f0">}</text>
      <text x="24" y="388" fill="#67e8f9">render(time) { … }</text>
      <text x="24" y="432" fill="#e2e8f0">disconnectedCallback() { … }</text>
      <text y="476" fill="#a7f3d0">}</text>
    </g>
  </g>
  <path d="M680 360H790" stroke="#7c3aed" stroke-width="7"/><path d="M768 342L795 360 768 378" fill="none" stroke="#7c3aed" stroke-width="7"/>
  <path d="M680 610H790" stroke="#06b6d4" stroke-width="7"/><path d="M768 592L795 610 768 628" fill="none" stroke="#06b6d4" stroke-width="7"/>
  <g transform="translate(830 170)" font-family="system-ui,sans-serif">
    <rect width="680" height="275" rx="28" fill="#fff" stroke="#d7dee8" stroke-width="2"/>
    <circle cx="62" cy="65" r="28" fill="#ede9fe"/><text x="62" y="75" text-anchor="middle" font-size="28" font-weight="800" fill="#7c3aed">A</text>
    <text x="112" y="60" font-size="30" font-weight="800" fill="#111827">系统静态读取</text>
    <text x="112" y="101" font-size="21" fill="#64748b">不执行项目代码，也能认识资源</text>
    <g transform="translate(50 150)" font-size="20" font-weight="650"><rect width="130" height="55" rx="27" fill="#f3e8ff"/><text x="65" y="35" text-anchor="middle" fill="#7e22ce">校验</text><rect x="150" width="130" height="55" rx="27" fill="#eef2ff"/><text x="215" y="35" text-anchor="middle" fill="#4338ca">资源卡片</text><rect x="300" width="130" height="55" rx="27" fill="#ecfeff"/><text x="365" y="35" text-anchor="middle" fill="#0e7490">默认时长</text><rect x="450" width="150" height="55" rx="27" fill="#ecfdf5"/><text x="525" y="35" text-anchor="middle" fill="#047857">参数面板</text></g>
  </g>
  <g transform="translate(830 515)" font-family="system-ui,sans-serif">
    <rect width="680" height="275" rx="28" fill="#111827"/>
    <circle cx="62" cy="65" r="28" fill="#10313b"/><text x="62" y="75" text-anchor="middle" font-size="28" font-weight="800" fill="#22d3ee">B</text>
    <text x="112" y="60" font-size="30" font-weight="800" fill="#fff">浏览器运行组件</text>
    <text x="112" y="101" font-size="21" fill="#94a3b8">注入 Props、GSAP 与准确时间</text>
    <g transform="translate(50 150)" font-size="20" font-weight="650"><rect width="150" height="55" rx="27" fill="#211b3d" stroke="#7c3aed"/><text x="75" y="35" text-anchor="middle" fill="#ddd6fe">Live SVG</text><rect x="175" width="150" height="55" rx="27" fill="#102934" stroke="#06b6d4"/><text x="250" y="35" text-anchor="middle" fill="#a5f3fc">render(t)</text><rect x="350" width="190" height="55" rx="27" fill="#10271f" stroke="#10b981"/><text x="445" y="35" text-anchor="middle" fill="#a7f3d0">ImageBitmap</text></g>
  </g>
</svg>
