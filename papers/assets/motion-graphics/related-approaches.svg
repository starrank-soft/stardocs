<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Motion Graphics 相关方案的不同边界</title><desc id="d">Lottie、Remotion、Rive、Motion Canvas 和可执行 SVG MG 从不同问题出发。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="105" font-family="system-ui,sans-serif" font-size="46" font-weight="800" fill="#111827">不是选一个普遍赢家，而是选择合适的边界</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(585 270)"><circle cx="215" cy="215" r="185" fill="#111827"/><circle cx="215" cy="215" r="147" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 12"/><text x="215" y="180" text-anchor="middle" font-size="25" font-weight="800" fill="#c4b5fd">视频编辑器中的 MG</text><text x="215" y="224" text-anchor="middle" font-size="22" fill="#fff">AI 可读写</text><text x="215" y="261" text-anchor="middle" font-size="22" fill="#fff">随机 Seek</text><text x="215" y="298" text-anchor="middle" font-size="22" fill="#fff">Live Preview + Frame Export</text></g>
    <g transform="translate(90 185)"><rect width="390" height="205" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="55" cy="55" r="27" fill="#fee2e2"/><text x="55" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">L</text><text x="100" y="62" font-size="28" font-weight="800" fill="#111827">Lottie</text><text x="32" y="114" font-size="20" fill="#475569">JSON 矢量交换格式</text><text x="32" y="151" font-size="20" fill="#475569">AE 工作流 · 跨平台播放器</text><text x="32" y="183" font-size="18" fill="#64748b">成熟生态与可移植性</text></g>
    <g transform="translate(1120 185)"><rect width="390" height="205" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="55" cy="55" r="27" fill="#dbeafe"/><text x="55" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#2563eb">R</text><text x="100" y="62" font-size="28" font-weight="800" fill="#111827">Remotion</text><text x="32" y="114" font-size="20" fill="#475569">React 程序化视频</text><text x="32" y="151" font-size="20" fill="#475569">Current Frame · 完整渲染体系</text><text x="32" y="183" font-size="18" fill="#64748b">擅长用代码构建整支视频</text></g>
    <g transform="translate(90 535)"><rect width="390" height="205" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="55" cy="55" r="27" fill="#dcfce7"/><text x="55" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#16a34a">R</text><text x="100" y="62" font-size="28" font-weight="800" fill="#111827">Rive</text><text x="32" y="114" font-size="20" fill="#475569">矢量交互与状态机</text><text x="32" y="151" font-size="20" fill="#475569">设计器 · 数据绑定 · 跨端 Runtime</text><text x="32" y="183" font-size="18" fill="#64748b">擅长 App 与游戏交互动画</text></g>
    <g transform="translate(1120 535)"><rect width="390" height="205" rx="25" fill="#fff" stroke="#d7dee8" stroke-width="2"/><circle cx="55" cy="55" r="27" fill="#fef3c7"/><text x="55" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#d97706">M</text><text x="100" y="62" font-size="28" font-weight="800" fill="#111827">Motion Canvas</text><text x="32" y="114" font-size="20" fill="#475569">TypeScript 矢量动画</text><text x="32" y="151" font-size="20" fill="#475569">Generator · 实时编辑器</text><text x="32" y="183" font-size="18" fill="#64748b">擅长讲解动画与旁白同步</text></g>
